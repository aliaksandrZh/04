<!DOCTYPE html>
<html lang="en" data-theme="dark">
<!--
  ============================================================================
  Docker UI — single-file visual builder for Dockerfile + docker-compose.yml
  ============================================================================
  Zero dependencies, no build step, no network requests. Open directly via
  file:// or serve statically.

  STRUCTURE
    <style>    CSS custom-property theme tokens (dark default + a
               [data-theme="light"] override), the three-pane grid layout,
               component styles, responsive breakpoints (≤1100px narrower
               preview, ≤900px stacked layout with chip nav) and
               prefers-reduced-motion handling.
    <header>   App bar: title, Reset button, theme toggle.
    <nav>      Section navigation: Image (Dockerfile), Compose, Volumes,
               Networks, Environment.
    <main>     The active section's form, rendered by JS into #form.
    <section>  Live preview: Dockerfile / docker-compose.yml tabs (ARIA
               tablist with roving tabindex), Copy / Download / copy-as-
               `docker run` buttons, validation banners and an aria-live
               status line that feeds the syntax-highlighted <pre><code>.
    <datalist> Image / volume-driver presets for free-text inputs.
    <script>   One IIFE with a single delegated event pipeline:
               input|change → mutate in-memory state → 150 ms debounce →
               validate (E1–E8) → emit Dockerfile + compose YAML (hand-rolled
               serializer, no JSON.stringify) → syntax highlight (hand-rolled
               tokenizers) → render preview + inline errors → persist to
               localStorage.

  STATE
    Whole form state is persisted under localStorage key "docker-ui-state-v3"
    (theme under "docker-ui-theme"); corrupt/missing state falls back to a
    seeded sample project. Value edits never re-render forms (caret stays
    put); structural edits re-render only the affected section. All dynamic
    DOM is built with createElement/textContent — no innerHTML for any
    user-entered data.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker UI — Dockerfile &amp; Compose builder</title>
<style>
/* ---------- theme tokens ---------- */
:root {
  --bg: #0f1117;
  --panel: #171a21;
  --surface: #1b202b;
  --border: #262b36;
  --border-soft: #20242e;
  --text: #e8ecf3;
  --muted: #8b93a5;
  --accent: #4f8cff;
  --accent-soft: rgba(79, 140, 255, .16);
  --error: #ff5d5d;
  --error-soft: rgba(255, 93, 93, .12);
  --success: #3ecf8e;
  --warn: #ffb454;
  --warn-soft: rgba(255, 180, 84, .12);
  --code-bg: #0c0e14;
  --radius: 6px;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
[data-theme="light"] {
  --bg: #f2f5f9;
  --panel: #ffffff;
  --surface: #f0f3f8;
  --border: #d7ddea;
  --border-soft: #e5e9f1;
  --text: #1a2230;
  --muted: #5d6779;
  --accent: #2b62d9;
  --accent-soft: rgba(43, 98, 217, .12);
  --error: #d23f3f;
  --error-soft: rgba(210, 63, 63, .08);
  --success: #178a58;
  --warn: #92620d;
  --warn-soft: rgba(146, 98, 13, .09);
  --code-bg: #fbfcfe;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
  display: grid;
  grid-template:
    "top top top" auto
    "nav form prev" minmax(0, 1fr)
    / 260px minmax(0, 1fr) minmax(380px, 42%);
  height: 100dvh;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ---------- top bar ---------- */
.topbar {
  grid-area: top;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
.brand .bico { display: inline-flex; color: var(--accent); }
.top-actions { display: flex; gap: 8px; }

/* ---------- buttons ---------- */
.btn {
  font: inherit; color: var(--text);
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 7px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background-color .12s, border-color .12s, color .12s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:active { transform: translateY(0.5px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { color: #fff; filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger:hover { color: var(--error); border-color: var(--error); background: var(--error-soft); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn.icon-only { padding: 4px 6px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .bico { display: inline-flex; }

/* ---------- sidebar nav ---------- */
.sidebar {
  grid-area: nav; min-width: 0;
  background: var(--panel); border-right: 1px solid var(--border);
  padding: 12px 8px; display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto;
}
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 11px; text-align: left;
  background: transparent; color: var(--muted);
  border: 1px solid transparent; border-radius: var(--radius);
  font: inherit; cursor: pointer;
  transition: background-color .12s, color .12s, border-color .12s;
}
.nav-btn:hover { color: var(--text); background: var(--surface); }
.nav-btn[aria-current="page"] { color: var(--text); background: var(--accent-soft); border-color: var(--border); }
.nav-btn .bico { display: inline-flex; flex: none; }

/* ---------- form panel ---------- */
.form-panel {
  grid-area: form; min-width: 0;
  overflow-y: auto; padding: 16px 18px 40px;
}
.sec-title { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; font-size: 15px; }
.sec-title .bico { color: var(--accent); display: inline-flex; }
.sec-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 15px; margin-bottom: 13px;
}
.card-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; }
.card-title { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13.5px; font-weight: 600; color: var(--muted); letter-spacing: .3px; text-transform: uppercase; }
.card-head .spacer { flex: 1 1 auto; min-width: 0; }
.divider { border: 0; border-top: 1px solid var(--border-soft); margin: 12px 0; }
.group-label { font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .4px; }
.group-label:first-child { margin-top: 0; }

/* ---------- fields ---------- */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; margin-bottom: 10px; }
.field > label { font-size: 12px; color: var(--muted); }
input[type="text"], select, textarea {
  font: inherit; color: var(--text);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 7px 9px; min-width: 0; max-width: 100%;
  transition: border-color .12s, box-shadow .12s, background-color .12s;
}
[data-theme="light"] input[type="text"], [data-theme="light"] select, [data-theme="light"] textarea { background: #fff; }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input.invalid, select.invalid, textarea.invalid { border-color: var(--error); }
input.invalid:focus, select.invalid:focus, textarea.invalid:focus { box-shadow: 0 0 0 3px var(--error-soft); }
.field-err { margin: 0; color: var(--error); font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
.row { display: flex; gap: 9px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 8px; }
.row .field { margin-bottom: 0; }
.row .spacer, .card-head .spacer { flex: 1 1 auto; min-width: 0; }
.row .grow { flex: 1 1 120px; }
.row .w-sm { flex: 0 1 120px; }
.row .w-md { flex: 0 1 180px; }
.row .w-lg { flex: 0 1 320px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 9px 12px; margin-bottom: 8px; }
.grid2 .field { margin-bottom: 0; }
.check-line { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; margin-right: 12px; padding: 3px 2px; }
.check-line input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 2px 4px; }

/* toggle switch */
.switch { appearance: none; -webkit-appearance: none; position: relative; flex: none;
  width: 34px; height: 20px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--border-soft); cursor: pointer; transition: background-color .12s, border-color .12s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--muted); transition: left .12s, background-color .12s; }
.switch:checked { background: var(--accent); border-color: var(--accent); }
.switch:checked::after { left: 16px; background: #fff; }
.switch-row { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }

/* ---------- steps (repeatable, draggable) ---------- */
.steps { list-style: none; margin: 8px 0 0; padding: 0; }
.step-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 10px; margin-top: 8px;
}
.step-row.dragging { opacity: .45; }
.step-row.drop-target { border-color: var(--accent); }
.step-head { display: flex; align-items: center; gap: 6px; }
.step-head .grip {
  cursor: grab; color: var(--muted); border: 1px solid transparent; border-radius: 4px;
  background: transparent; padding: 3px 2px; display: inline-flex; align-items: center;
}
.step-head .grip:hover { color: var(--text); border-color: var(--border); background: var(--panel); }
.step-head .grip:active { cursor: grabbing; }
.step-head select { padding: 4px 8px; font-weight: 600; letter-spacing: .4px; }
.step-head .spacer { flex: 1 1 auto; }
.step-body { margin-top: 8px; }
.step-num { color: var(--muted); font-size: 11px; min-width: 16px; text-align: right; }

/* ---------- preview ---------- */
#preview {
  grid-area: prev; min-width: 0; display: flex; flex-direction: column;
  background: var(--code-bg); border-left: 1px solid var(--border);
}
.pv-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
  flex-wrap: wrap; padding: 0 10px 0 12px; background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 3px; }
.tab {
  font: 13px var(--mono); color: var(--muted); background: transparent;
  border: 1px solid transparent; border-bottom: none; border-radius: var(--radius) var(--radius) 0 0;
  padding: 7px 13px 8px; cursor: pointer;
  transition: color .12s, background-color .12s;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] {
  color: var(--text); background: var(--code-bg); border-color: var(--border);
  box-shadow: inset 0 2px 0 var(--accent);
}
.pv-actions { display: flex; gap: 6px; padding-bottom: 6px; }
.status { margin: 0; padding: 3px 14px; color: var(--muted); font: 11.5px/1.7 var(--mono); }
.banner { margin: 8px 12px 0; padding: 8px 12px; border-radius: var(--radius); font-size: 12.5px; border: 1px solid; }
.banner.error { color: var(--error); border-color: var(--error); background: var(--error-soft); }
.banner.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.banner ul { margin: 4px 0 0; padding-left: 18px; }
.banner li { margin: 1px 0; }
.code-panel { flex: 1 1 auto; overflow: auto; padding: 12px 14px 40px; }
.code-panel pre { margin: 0; font: 12.5px/1.65 var(--mono); color: var(--text); tab-size: 2; }
.code-panel code { display: block; white-space: pre; }
.tok-kw { color: var(--accent); font-weight: 650; }
.tok-str { color: var(--success); }
.tok-num { color: #d8a05c; }
.tok-cmt { color: var(--muted); font-style: italic; }
.tok-flag { color: #c08af0; }
.tok-key { color: var(--accent); }
.tok-bool { color: #d8a05c; }
[data-theme="light"] .tok-flag { color: #7a3fd3; }
[data-theme="light"] .tok-num, [data-theme="light"] .tok-bool { color: #9a6410; }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 14px);
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); padding: 8px 15px; font-size: 13px; max-width: min(90vw, 560px);
  opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 50;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.ok { border-color: var(--success); }
#toast.err { border-color: var(--error); }

/* ---------- code fields / env preview ---------- */
.mono { font-family: var(--mono); }
.env-raw-card pre { margin: 8px 0 0; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: auto; font: 12.5px/1.6 var(--mono); }
textarea { font-family: var(--mono); font-size: 13px; resize: vertical; min-height: 86px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  body { grid-template: "top top top" auto "nav form prev" minmax(0, 1fr) / 225px minmax(0, 1fr) minmax(320px, 40%); }
}
@media (max-width: 900px) {
  body { display: block; height: auto; min-height: 100dvh; overflow-y: auto; }
  .topbar { position: sticky; top: 0; z-index: 20; }
  .sidebar {
    position: sticky; top: 47px; z-index: 19;
    flex-direction: row; flex-wrap: wrap; gap: 4px;
    border-right: none; border-bottom: 1px solid var(--border); padding: 8px 10px;
  }
  .nav-btn { padding: 6px 10px; font-size: 13px; border-color: var(--border); }
  .nav-btn .txt { display: none; }
  .nav-btn[aria-current="page"] .txt { display: inline; font-weight: 600; }
  .form-panel { overflow: visible; padding-bottom: 10px; }
  #preview { min-height: 70vh; border-left: none; border-top: 1px solid var(--border); }
  .code-panel { max-height: 64vh; }
}
@media (max-width: 420px) {
  .topbar { padding: 8px 10px; }
  .form-panel { padding: 12px 10px 30px; }
  .pv-actions .btn { padding: 3px 7px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <h1 class="brand"><span class="bico" data-ico="cube"></span>Docker UI</h1>
  <div class="top-actions">
    <button type="button" class="btn ghost" data-action="reset">Reset</button>
    <button type="button" class="btn ghost icon-only" data-action="theme" id="theme-btn"><span id="theme-ico"></span></button>
  </div>
</header>

<nav class="sidebar" id="sidebar" aria-label="Configuration sections"></nav>

<main class="form-panel" id="form" aria-label="Configuration form"></main>

<section id="preview" aria-label="Generated files preview">
  <div class="pv-head">
    <div class="tabs" role="tablist" aria-label="Preview file" id="tablist">
      <button type="button" class="tab" role="tab" id="tab-dockerfile" data-action="tab" data-value="dockerfile"
        aria-selected="true" tabindex="0" aria-controls="code-panel">Dockerfile</button>
      <button type="button" class="tab" role="tab" id="tab-compose" data-action="tab" data-value="compose"
        aria-selected="false" tabindex="-1" aria-controls="code-panel">docker-compose.yml</button>
    </div>
    <div class="pv-actions">
      <button type="button" class="btn ghost small" data-action="copy-run" id="btn-run"
        title="Copy an equivalent docker run command for the first service"><span class="bico" data-ico="play"></span>docker run</button>
      <button type="button" class="btn ghost small" data-action="copy" id="btn-copy" title="Copy the active file to the clipboard"><span class="bico" data-ico="copy"></span>Copy</button>
      <button type="button" class="btn primary small" data-action="download" id="btn-dl" title="Download the active file"><span class="bico" data-ico="download"></span>Download</button>
    </div>
  </div>
  <p class="status" id="gen-status" aria-live="polite"></p>
  <div class="banner error" id="banner-err" hidden></div>
  <div class="banner warn" id="banner-warn" hidden></div>
  <div class="code-panel" id="code-panel" role="tabpanel" tabindex="0" aria-labelledby="tab-dockerfile">
    <pre><code id="code-out"></code></pre>
  </div>
</section>

<div id="toast" role="status"></div>

<datalist id="dl-images"></datalist>
<datalist id="dl-drivers">
  <option value="local"></option>
  <option value="overlay"></option>
  <option value="overlay2"></option>
  <option value="tmpfs"></option>
  <option value="nfs"></option>
  <option value="azurefile"></option>
  <option value="cloudstor"></option>
</datalist>
<script>
(() => {
'use strict';

/* =========================================================================
   1. Icons (inline SVG via createElementNS — no icon fonts, no innerHTML)
   ========================================================================= */
const ICONS = {
  cube: [
    ['path', { d: 'M21 8 12 3 3 8v8l9 5 9-5V8z' }],
    ['path', { d: 'M3 8l9 5 9-5' }],

  ],

  ],
  disk: [

    ['path', { d: 'M4 6v12c0 1.66 3.6 3 8 3s8-1.34 8-3V6' }],
    ['path', { d: 'M20 12c0 1.66-3.6 3-8 3s-8-1.34-8-3' }],
  ],
  globe: [

    ['path', { d: 'M12 3c2.5 2.5 2.5 15.5 0 18' }],
    ['path', { d: 'M12 3c-2.5 2.5-2.5 15.5 0 18' }],
  ],

  ],
  sun: [
    ['circle', { cx: 12, cy: 12, r: 4 }],
    ['path', { d: 'M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' }],
  ],
  moon: [['path', { d: 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z' }]],
  copy: [
    ['rect', { x: 9, y: 9, width: 11, height: 11, rx: 2 }],
    ['path', { d: 'M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1' }],
  ],

    ['path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }],

  ],

  chevup: [['path', { d: 'm18 15-6-6-6 6' }]],
  chevdown: [['path', { d: 'm6 9 6 6 6-6' }]],

  grip: [

    ['circle', { cx: 9, cy: 12, r: 1 }, 1.6],
    ['circle', { cx: 9, cy: 19, r: 1 }, 1.6],
    ['circle', { cx: 15, cy: 5, r: 1 }, 1.6],
    ['circle', { cx: 15, cy: 12, r: 1 }, 1.6],
    ['circle', { cx: 15, cy: 19, r: 1 }, 1.6],
  ],
};

function icon(name, size = 18) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  for (const def of (ICONS[name] || [])) {
    const [tag, attrs, sw] = def;
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (sw) { el.setAttribute('stroke-width', sw); el.setAttribute('fill', 'currentColor'); el.setAttribute('stroke', 'none'); }
    svg.appendChild(el);
  }
  return svg;
}

/* =========================================================================
   2. Constants
   ========================================================================= */
const STORAGE_KEY = 'docker-ui-state-v3';
const THEME_KEY = 'docker-ui-theme';

const VERSIONS = ['2.4', '3.8', '3.9', 'omit'];
const RESTARTS = ['no', 'always', 'on-failure', 'unless-stopped'];
const STEP_TYPES = ['RUN', 'COPY', 'WORKDIR', 'ENV', 'ARG', 'EXPOSE', 'USER', 'CMD', 'ENTRYPOINT', 'HEALTHCHECK'];
const IMAGE_PRESETS = [
  'node:20-alpine', 'node:22-alpine', 'node:20-bookworm-slim',
  'python:3.12-slim', 'python:3.12-alpine', 'python:3.11-slim',
  'nginx:alpine', 'nginx:1.27-alpine',
  'ubuntu:24.04', 'ubuntu:22.04', 'debian:bookworm-slim', 'alpine:3.20',
  'redis:7-alpine', 'postgres:16-alpine', 'mysql:8.4', 'mongo:7',
  'golang:1.22-alpine', 'rust:1.80-slim', 'eclipse-temurin:21-jre-alpine',

function uid() { return 'k' + Math.random().toString(36).slice(2, 10); }

function makeStep(type, over = {}) {

function uniqueName(base, taken) {

function seedState() {

function normalizeStep(stp) {

  const type = STEP_TYPES.includes(o.type) ? o.type : 'RUN';
  const base = makeStep(type);
  return Object.assign(base, {
    id: str(o.id) || uid(),
    cmd: str(o.cmd), src: str(o.src), dest: str(o.dest), chown: str(o.chown),
    from: str(o.from), value: str(o.value), port: str(o.port),

    hc: {

      timeout: str(obj(o.hc).timeout) || '5s',

function normalizeState(raw) {
  const s = obj(raw);
  const sd = obj(s.docker);
  const meta = obj(s.meta);

    __v: 3,
    docker: {
      multi: !!sd.multi,
      stages: arr(sd.stages).map(st => ({
        id: str(obj(st).id) || uid(),
        name: str(obj(st).name),
        baseImage: str(obj(st).baseImage),
        steps: arr(obj(st).steps).map(normalizeStep),

    },
    services: arr(s.services).map(sv => {

        id: str(t.id) || uid(),
        name: str(t.name), source: t.source === 'image' ? 'image' : 'build',
        image: str(t.image), buildPath: str(t.buildPath),
        dockerfileName: str(t.dockerfileName), buildTarget: str(t.buildTarget),
        containerName: str(t.containerName), restart: RESTARTS.includes(t.restart) ? t.restart : 'no',

        dependsOn: arr(t.dependsOn).map(str),
        env: arr(t.env).map(e => ({ id: str(obj(e).id) || uid(), key: str(obj(e).key), value: str(obj(e).value) })),

    volumes: arr(s.volumes).map(v => ({

const memoryStore = {};
function saveRaw(key, val) { try { localStorage.setItem(key, val); } catch (err) { memoryStore[key] = val; } }

  try { return localStorage.getItem(key); } catch (err) { return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null; }
}
function save() { saveRaw(STORAGE_KEY, JSON.stringify(state)); }
function loadState() {

    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.__v === 3 && parsed.docker) return normalizeState(parsed);
    } catch (err) { /* corrupt state → reseed */ }
  }
  return seedState();
}
function loadTheme() { return loadRaw(THEME_KEY) === 'light' ? 'light' : 'dark'; }

let state = seedState();

/* =========================================================================
   4. DOM helpers
   ========================================================================= */
function h(tag, attrs = {}) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === 'class') el.className = v;
    else el.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    let c = arguments[i];
    if (c == null) continue;
    if (!Array.isArray(c)) c = [c];
    for (const item of c) {
      if (item == null) continue;
      el.append(item.nodeType ? item : document.createTextNode(item));
    }
  }
  return el;
}

function errId(path) { return 'fe-' + String(path).replace(/[^A-Za-z0-9]+/g, '-'); }

function fld(labelText, control, opts = {}) {
  const id = 'c' + uid();
  control.id = id;
  const wrap = h('div', { class: opts.wide ? 'field wide' : 'field' });
  if (labelText != null) {
    const lb = h('label', { for: id });
    lb.textContent = labelText;
    wrap.append(lb);
  }
  wrap.append(control);
  if (opts.err) {
    control.setAttribute('data-err', opts.err);
    const p = h('p', { class: 'field-err', id: errId(opts.err) });
    p.hidden = true;
    wrap.append(p);
    control.setAttribute('aria-describedby', p.id);
  }
  if (opts.hint) wrap.append(hintNode(opts.hint));
  if (opts.flex) {
    wrap.style.flex = '1 1 170px';
    wrap.style.maxWidth = '360px';
    wrap.style.minWidth = '130px';
  }
  return wrap;
}
function hintNode(text) { const p = h('p', { class: 'hint' }); p.textContent = text; return p; }

function textInput(bind, value, opts = {}) {
  const el = h('input', { type: 'text', 'data-field': bind });
  el.value = value == null ? '' : value;
  if (opts.ph) el.placeholder = opts.ph;
  if (opts.aria) el.setAttribute('aria-label', opts.aria);
  if (opts.list) el.setAttribute('list', opts.list);
  if (opts.rerender) el.setAttribute('data-rerender', '1');
  if (!opts.autoWidth) el.spellcheck = false;
  return el;
}

function selectInput(bind, value, options, opts = {}) {
  const el = h('select', { 'data-field': bind });
  for (const o of options) {
    const op = h('option', { value: o.v });
    op.textContent = o.label != null ? o.label : o.v;
    el.append(op);
  }
  const vals = options.map(o => o.v);
  el.value = vals.includes(value) ? value : (vals.length ? vals[0] : '');
  if (opts.aria) el.setAttribute('aria-label', opts.aria);
  if (opts.rerender) el.setAttribute('data-rerender', '1');
  return el;
}

function checkInput(bind, checked, kind = 'bool', value = '') {
  const el = h('input', { type: 'checkbox', 'data-field': bind, 'data-kind': kind });
  if (kind === 'list-toggle') el.setAttribute('data-value', value);
  el.checked = checked;
  return el;
}

function rowDel(action, arg, label) {
  const b = h('button', { type: 'button', class: 'btn danger small icon-only', 'data-action': action, 'data-arg': arg, 'aria-label': label, title: label });
  b.append(icon('x', 14));
  return b;
}
function rowAdd(action, arg, label, primary = false) {
  const b = h('button', { type: 'button', class: (primary ? 'btn primary small' : 'btn ghost small'), 'data-action': action, 'data-arg': arg || '' });
  b.append(icon('plus', 13), label);
  return b;
}
function ghostBtn(action, arg, label) {
  return h('button', { type: 'button', class: 'btn ghost small', 'data-action': action, 'data-arg': arg || '' }, label);
}
function groupLabel(text) { return h('p', { class: 'group-label' }, text); }
function subLine(text) { const p = h('p', { class: 'sec-sub' }); p.textContent = text; return p; }

function getAtPath(path) {
  let node = state;
  for (const part of String(path).split('.')) {
    if (node == null) return undefined;
    node = node[part];
  }
  return node;
}
function setAtPath(path, value) {
  const parts = String(path).split('.');
  const last = parts.pop();
  let node = state;
  for (const part of parts) node = node[part];
  node[last] = value;

/* =========================================================================
   5. Emitters
   ========================================================================= */
class RawString { constructor(v) { this.v = String(v); } }

const INDICATOR_RX = /^[-?:,[\]{}#&*!|>'"%@`\s]/;
const BOOL_RX = /^(?:true|false|yes|no|on|off|null|~)$/i;
const NUM_RX = /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;

function needsQuote(s) {
  if (s === '') return true;
  if (s !== s.trim()) return true;
  if (/[:#]/.test(s)) return true;
  if (INDICATOR_RX.test(s)) return true;
  if (BOOL_RX.test(s)) return true;
  if (NUM_RX.test(s)) return true;
  if (/^0\d/.test(s)) return true;
  return false;
}
function escapeDQ(s) { return s.replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }
function yScalar(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? String(v) : 'null';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  const s = String(v);
  return needsQuote(s) ? '"' + escapeDQ(s) + '"' : s;
}
function yKey(k) {
  const s = String(k);
  return needsQuote(s) ? '"' + escapeDQ(s) + '"' : s;
}
function jsonStr(s) { return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'; }
function flowSeqJson(items) { return '[' + items.map(jsonStr).join(', ') + ']'; }
function splitArgs(s) {
  const t = String(s || '').trim();
  if (!t) return [];
  const parts = t.includes(',') ? t.split(',') : t.split(/\s+/);
  return parts.map(p => p.trim()).filter(Boolean);
}

function emitKeyValue(key, value, indent, out) {
  const pad = '  '.repeat(indent);
  const k = yKey(key);
  if (value instanceof RawString) { out.push(pad + k + ': ' + value.v); return; }
  // An empty string in map position is a real value (e.g. environment: MY_FLAG=)
  // — emit it explicitly; only null/undefined mean "no key at all".
  if (value === '') { out.push(pad + k + ": ''"); return; }
  if (value === null || value === undefined) return;
  if (typeof value !== 'object') { out.push(pad + k + ': ' + yScalar(value)); return; }
  if (Array.isArray(value)) {
    if (!value.length) { out.push(pad + k + ': []'); return; }
    out.push(pad + k + ':');
    value.forEach(item => emitListItem(item, indent + 1, out));
    return;
  }
  if (!Object.keys(value).length) { out.push(pad + k + ': {}'); return; }
  out.push(pad + k + ':');
  emitMap(value, indent + 1, out);
}
function emitMap(map, indent, out) {
  for (const [k, v] of Object.entries(map)) emitKeyValue(k, v, indent, out);
}
function emitListItem(item, indent, out) {
  const pad = '  '.repeat(indent);
  if (item === null || item === undefined || item === '') { out.push(pad + "- ''"); return; }
  if (item instanceof RawString) { out.push(pad + '- ' + item.v); return; }
  if (typeof item !== 'object') { out.push(pad + '- ' + yScalar(item)); return; }
  const entries = Object.entries(item);
  if (!entries.length) { out.push(pad + '- {}'); return; }
  const [k0, v0] = entries[0];
  if (v0 !== null && typeof v0 === 'object' && !(v0 instanceof RawString)) {
    out.push(pad + '- ' + yKey(k0) + ':');
    if (Array.isArray(v0)) v0.forEach(it => emitListItem(it, indent + 1, out));
    else emitMap(v0, indent + 1, out);
  } else {
    out.push(pad + '- ' + yKey(k0) + ': ' + (v0 instanceof RawString ? v0.v : yScalar(v0)));
  }
  for (let i = 1; i < entries.length; i++) emitKeyValue(entries[i][0], entries[i][1], indent + 1, out);
}

function buildComposeObject() {
  const doc = {};
  if (state.meta.composeVersion !== 'omit') doc.version = state.meta.composeVersion;

  const services = {};
  state.services.forEach(svc => {
    const name = svc.name.trim();
    const o = {};
    if (svc.source === 'image') {
      const img = svc.image.trim();
      if (img) o.image = img;
    } else {
      const ctx = svc.buildPath.trim();
      const dfn = svc.dockerfileName.trim();
      const tgt = svc.buildTarget.trim();
      if (!dfn && !tgt) { if (ctx) o.build = ctx; }
      else {
        const b = {};
        if (ctx) b.context = ctx;
        if (dfn) b.dockerfile = dfn;
        if (tgt) b.target = tgt;
        o.build = b;
      }
    }
    const cn = svc.containerName.trim();
    if (cn) o.container_name = cn;
    o.restart = svc.restart || 'no';
    const ports = [];
    svc.ports.forEach(p => {
      const hst = p.host.trim(), cnt = p.container.trim();
      if (!hst && !cnt) return;
      let map = hst + ':' + cnt;
      if (p.proto === 'udp') map += '/udp';
      ports.push(map);
    });
    if (ports.length) o.ports = ports;
    const env = {};
    let envAny = false;
    svc.env.forEach(e => {
      const k = e.key.trim();
      if (!k) return;
      envAny = true;
      env[k] = e.value;
    });
    if (envAny) o.environment = env;
    if (svc.dependsOn.length) o.depends_on = svc.dependsOn.slice();
    const cmd = svc.command.trim();
    if (cmd) o.command = svc.commandStyle === 'exec' ? new RawString(flowSeqJson(splitArgs(cmd))) : cmd;
    if (svc.healthcheck.enabled) {
      const hh = {};
      const test = svc.healthcheck.cmd.trim();
      if (test) hh.test = new RawString(flowSeqJson(['CMD-SHELL', test]));
      const iv = svc.healthcheck.interval.trim();
      if (iv) hh.interval = iv;
      const to = svc.healthcheck.timeout.trim();
      if (to) hh.timeout = to;
      const rt = parseInt(svc.healthcheck.retries, 10);
      if (rt > 0) hh.retries = rt;
      if (Object.keys(hh).length) o.healthcheck = hh;
    }
    const mounts = [];
    svc.volumeMounts.forEach(m => {
      if (!m.volume || !m.target.trim()) return;
      mounts.push(m.volume + ':' + m.target.trim());
    });
    if (mounts.length) o.volumes = mounts;
    if (svc.networks.length) o.networks = svc.networks.slice();
    services[name || '(unnamed)'] = o;
  });
  doc.services = services;

  const vols = {};
  let vAny = false;
  state.volumes.forEach(v => {
    const n = v.name.trim();
    if (!n) return;
    const vo = {};
    if (v.driver.trim()) vo.driver = v.driver.trim();
    const opts = {};
    v.driverOpts.forEach(x => { const k = x.k.trim(); if (k) opts[k] = x.v; });
    if (Object.keys(opts).length) vo.driver_opts = opts;
    vols[n] = vo;
    vAny = true;
  });
  if (vAny) doc.volumes = vols;

  const nets = {};
  let nAny = false;
  state.networks.forEach(nt => {
    const n = nt.name.trim();
    if (!n) return;
    const no = {};
    if (nt.driver.trim()) no.driver = nt.driver.trim();
    if (nt.subnet.trim()) no.ipam = { config: [{ subnet: nt.subnet.trim() }] };
    nets[n] = no;
    nAny = true;
  });
  if (nAny) doc.networks = nets;

  return doc;
}

function emitComposeYaml() {
  const out = [];
  const doc = buildComposeObject();
  for (const [k, v] of Object.entries(doc)) emitKeyValue(k, v, 0, out);
  let text = out.join('\n');
  if (text) text += '\n';
  return text;
}

function emitStepLines(s, out) {
  switch (s.type) {
    case 'RUN': {
      const c = s.cmd.trim();
      if (!c) return;
      const parts = c.split(/\s*&&\s*/);
      if (parts.length > 1) {
        // Dockerfile line continuation: every line except the last must end with
        // a trailing \ or Docker rejects the file ("unknown instruction: &&").
        out.push('RUN ' + parts[0] + ' \\');
        for (let i = 1; i < parts.length; i++) {
          out.push('    && ' + parts[i] + (i < parts.length - 1 ? ' \\' : ''));
        }
      } else {
        out.push('RUN ' + c);
      }
      return;
    }
    case 'COPY': {
      const src = s.src.trim(), dest = s.dest.trim();
      if (!src && !dest) return;
      const bits = ['COPY'];
      if (state.docker.multi && s.from) bits.push('--from=' + s.from);
      if (s.chown.trim()) bits.push('--chown=' + s.chown.trim());
      bits.push(src || '.', dest || '.');
      out.push(bits.join(' '));
      return;
    }
    case 'WORKDIR': if (s.value.trim()) out.push('WORKDIR ' + s.value.trim()); return;
    case 'USER': if (s.value.trim()) out.push('USER ' + s.value.trim()); return;
    case 'ENV':
      s.pairs.forEach(p => {
        const k = p.k.trim();
        if (!k) return;
        const v = p.v;
        const val = (/[\s]/.test(v) || v === '') ? '"' + escapeDQ(v) + '"' : v;
        out.push('ENV ' + k + '=' + val);
      });
      return;
    case 'ARG':
      s.pairs.forEach(p => {
        const k = p.k.trim();
        if (!k) return;
        const v = p.v;
        if (!v) { out.push('ARG ' + k); return; }
        const val = /^[\w./-]+$/.test(v) ? v : '"' + escapeDQ(v) + '"';
        out.push('ARG ' + k + '=' + val);
      });
      return;
    case 'EXPOSE': {
      const p = s.port.trim();
      if (!p) return;
      out.push('EXPOSE ' + p + (s.proto === 'udp' ? '/udp' : ''));
      return;
    }
    case 'CMD':
    case 'ENTRYPOINT': {
      if (s.style === 'exec') {
        const a = splitArgs(s.args);
        if (a.length) out.push(s.type + ' ' + flowSeqJson(a));
        return;
      }
      const c = s.args.trim();
      if (c) out.push(s.type + ' ' + c);
      return;
    }
    case 'HEALTHCHECK': {
      const flags = [];
      if (s.hc.interval.trim()) flags.push('--interval=' + s.hc.interval.trim());
      if (s.hc.timeout.trim()) flags.push('--timeout=' + s.hc.timeout.trim());
      if (s.hc.startPeriod.trim()) flags.push('--start-period=' + s.hc.startPeriod.trim());
      const rt = parseInt(s.hc.retries, 10);
      if (rt > 0) flags.push('--retries=' + rt);
      const c = s.hc.cmd.trim();
      if (!c && !flags.length) return;
      if (!c) { out.push('HEALTHCHECK NONE'); return; }
      out.push('HEALTHCHECK' + (flags.length ? ' ' + flags.join(' ') : '') + ' CMD ' + c);
      return;
    }
    default: return;
  }
}

function emitDockerfile() {
  const multi = !!state.docker.multi;
  const stages = multi ? state.docker.stages : state.docker.stages.slice(0, 1);
  const out = [];
  stages.forEach((st, i) => {
    const base = st.baseImage.trim();
    let head = 'FROM ' + (base || '<base-image>');
    if (multi && st.name.trim()) head += ' AS ' + st.name.trim();
    out.push(head);
    (st.steps || []).forEach(s => emitStepLines(s, out));
    if (i < stages.length - 1) out.push('');
  });
  return out.join('\n') + '\n';
}

function envFileText() {
  const rows = state.envFile.filter(e => e.key.trim()).map(e => e.key.trim() + '=' + e.value);
  if (!rows.length) return '# .env\n';
  return rows.join('\n') + '\n';
}

// POSIX single-quoting: $, ` and \ stay literal inside single quotes; embedded
// single quotes are closed-and-escaped as '\'' so the user's shell never expands them.
function shQuote(v) {
  if (!/[^\w@%+=:,./-]/.test(v)) return v;
  return "'" + v.replace(/'/g, "'\\''") + "'";
}

function dockerRunCmd() {
  const s = state.services[0];
  if (!s) return '# define a service first';
  const name = s.name.trim() || 'app';
  const parts = ['docker run'];
  if (s.containerName.trim()) parts.push('--name ' + shQuote(s.containerName.trim()));
  s.ports.forEach(p => {
    const hst = p.host.trim(), cnt = p.container.trim();
    if (hst && cnt) parts.push('-p ' + hst + ':' + cnt + (p.proto === 'udp' ? '/udp' : ''));
  });
  s.volumeMounts.forEach(m => {
    if (m.volume && m.target.trim()) parts.push('-v ' + m.volume + ':' + m.target.trim());
  });
  s.env.forEach(e => {
    const k = e.key.trim();
    if (!k) return;
    parts.push('-e ' + k + '=' + shQuote(e.value));
  });
  if (s.restart && s.restart !== 'no') parts.push('--restart ' + s.restart);
  s.networks.forEach(n => parts.push('--network ' + n));
  const img = s.source === 'image' ? (s.image.trim() || name) : name;
  parts.push(img);
  const cmd = s.command.trim();
  if (cmd) parts.push(s.commandStyle === 'exec' ? splitArgs(cmd).map(shQuote).join(' ') : cmd);
  const run = parts.join(' ');
  if (s.source === 'build') {
    return 'docker build -t ' + img + ' ' + shQuote(s.buildPath.trim() || '.') + '\n' + run;
  }
  return run;
}

/* =========================================================================
   6. Validation
   ========================================================================= */
function collectVarRefs() {
  // Scan the generated compose file itself instead of a hand-picked subset of
  // fields: compose interpolates ${VAR} everywhere — env values, ports, image,
  // container_name, volume mounts, networks, depends_on, command — so a full
  // scan keeps the "${VAR} referenced but undefined in .env" warning honest.
  const refs = new Set();
  const re = /\$\{([A-Za-z_][A-Za-z0-9_]*)\}/g;
  let m;
  const text = emitComposeYaml();
  while ((m = re.exec(text))) refs.add(m[1]);
  return refs;
}

function validate() {
  const errors = [];
  const warnings = [];
  const E = (path, msg) => errors.push({ path, msg });
  const multi = !!state.docker.multi;
  // Validate exactly what the form renders and the emitter writes: in single-stage
  // mode hidden leftover stages must not produce download-blocking errors.
  const stages = multi ? state.docker.stages : state.docker.stages.slice(0, 1);

  const stageNames = stages.map(st => st.name.trim());
  stages.forEach((st, i) => {
    const n = st.name.trim();
    if (multi) {
      if (!n) E(`docker.stages.${i}.name`, `Stage ${i + 1}: stage name is required in multi-stage mode`);
      else {
        if (!NAME_RX.test(n)) E(`docker.stages.${i}.name`, `Stage ${i + 1}: "${n}" contains invalid characters (start alphanumeric; letters, digits, _ . - only)`);
        if (stageNames.indexOf(n) !== i) E(`docker.stages.${i}.name`, `Stage name "${n}" is not unique`);
      }
    }
    if (!st.baseImage.trim()) E(`docker.stages.${i}.baseImage`, `Stage ${i + 1}: base image is required (FROM line)`);
    st.steps.forEach((s, j) => {
      const sp = `docker.stages.${i}.steps.${j}`;
      if (s.type === 'COPY' && s.from) {
        if (!multi) E(sp + '.from', 'COPY --from requires multi-stage mode');
        else {
          const ti = stageNames.indexOf(s.from);
          if (ti < 0) E(sp + '.from', `COPY --from="${s.from}" references no named stage`);
          else if (ti >= i) E(sp + '.from', `COPY --from="${s.from}" must reference an earlier stage`);
        }
      }
      if (s.type === 'EXPOSE' && s.port.trim() && !EXPOSE_RX.test(s.port.trim())) {
        E(sp + '.port', `EXPOSE "${s.port.trim()}" is not a valid port (digits or a range)`);
      }
      if (s.type === 'HEALTHCHECK' && !s.hc.cmd.trim()) {
        warnings.push(`Stage ${i + 1} step ${j + 1}: HEALTHCHECK step has no test command — will be emitted as HEALTHCHECK NONE, which disables any healthcheck inherited from the base image`);
      }
    });
  });

  const envKeys = [];
  state.envFile.forEach((e, i) => {
    const k = e.key.trim();
    if (!k) {
      if (e.value) E(`envFile.${i}.key`, `.env row ${i + 1}: key is required`);
      return;
    }
    if (!KEY_RX.test(k)) E(`envFile.${i}.key`, `"${k}" is not a valid .env key (letters, digits, _; not starting with a digit)`);
    else if (envKeys.indexOf(k) !== -1) E(`envFile.${i}.key`, `Duplicate .env key "${k}"`);
    envKeys.push(k);
  });

  if (!state.services.length) E('services', 'At least one service is required');
  const svcNames = state.services.map(sv => sv.name.trim());
  const definedVols = state.volumes.map(v => v.name.trim());
  const definedNets = state.networks.map(n => n.name.trim());
  const volCount = new Map();
  definedVols.forEach(n => volCount.set(n, (volCount.get(n) || 0) + 1));
  const netCount = new Map();
  definedNets.forEach(n => netCount.set(n, (netCount.get(n) || 0) + 1));

  state.volumes.forEach((v, i) => {
    const n = v.name.trim();
    if (!n) E(`volumes.${i}.name`, `Volume ${i + 1}: name is required`);
    else {
      if (!NAME_RX.test(n)) E(`volumes.${i}.name`, `Volume ${i + 1}: "${n}" contains invalid characters`);
      if (volCount.get(n) > 1) E(`volumes.${i}.name`, `Volume name "${n}" is not unique`);
    }
  });
  state.networks.forEach((n, i) => {
    const nm = n.name.trim();
    if (!nm) E(`networks.${i}.name`, `Network ${i + 1}: name is required`);
    else {
      if (!NAME_RX.test(nm)) E(`networks.${i}.name`, `Network ${i + 1}: "${nm}" contains invalid characters`);
      if (netCount.get(nm) > 1) E(`networks.${i}.name`, `Network name "${nm}" is not unique`);
      if (n.subnet.trim() && !/^\d{1,3}(\.\d{1,3}){3}\/\d{1,2}$/.test(n.subnet.trim())) {
        E(`networks.${i}.subnet`, `Network "${nm}": subnet should look like 172.28.0.0/16`);
      }
    }
  });

  state.services.forEach((svc, i) => {
    const sp = `services.${i}`;
    const name = svc.name.trim();
    if (!name) E(sp + '.name', 'Service name is required');
    else {
      if (!NAME_RX.test(name)) E(sp + '.name', `Service name "${name}" contains invalid characters`);
      if (svcNames.indexOf(name) !== i) E(sp + '.name', `Service name "${name}" is not unique`);
    }
    if (svc.source === 'image' && !svc.image.trim()) E(sp + '.image', 'Image is required when the "image" source is selected');
    if (svc.source === 'build') {
      if (!svc.buildPath.trim()) E(sp + '.build', 'Build context path is required when the "build" source is selected');
      const tgt = svc.buildTarget.trim();
      if (tgt) {
        if (!multi) E(sp + '.buildTarget', 'Build target requires a multi-stage Dockerfile');
        else if (!stageNames.includes(tgt)) E(sp + '.buildTarget', `Build target "${tgt}" is not a defined stage`);
      }
    }
    svc.ports.forEach((p, j) => {
      const hst = p.host.trim(), cnt = p.container.trim();
      if (!hst && !cnt) return;
      const full = `${hst}:${cnt}` + (p.proto === 'udp' ? '/udp' : '');
      if (!PORT_RX.test(full)) E(`${sp}.ports.${j}`, `Port mapping "${full}" must be host:container digits${p.proto === 'udp' ? '/udp' : ''}`);
    });
    const seenKeys = [];
    svc.env.forEach((e, j) => {
      const k = e.key.trim();
      if (!k && !e.value) return;
      if (!k) { E(`${sp}.env.${j}.k`, 'Environment key is required'); return; }
      if (!KEY_RX.test(k)) E(`${sp}.env.${j}.k`, `"${k}" is not a valid environment variable key`);
      else if (seenKeys.indexOf(k) !== -1) E(`${sp}.env.${j}.k`, `Duplicate key "${k}" in service environment`);
      seenKeys.push(k);
    });
    svc.dependsOn.forEach(d => {
      if (!svcNames.includes(d)) E(sp + '.dependsOn', `depends_on references undefined service "${d}"`);
    });
    svc.volumeMounts.forEach((m, j) => {
      if (!m.volume && !m.target.trim()) return;
      if (!m.volume) E(`${sp}.mounts.${j}.volume`, 'A named volume is required for this mount');
      else if (definedVols.indexOf(m.volume) === -1) E(`${sp}.mounts.${j}.volume`, `Volume "${m.volume}" is not declared in the Volumes section`);
      if (!m.target.trim()) E(`${sp}.mounts.${j}.target`, 'Mount target path is required (e.g. /data)');
    });
    svc.networks.forEach(n => {
      if (definedNets.indexOf(n) === -1) E(sp + '.networks', `Network "${n}" is not declared in the Networks section`);
    });
  });

  const refs = collectVarRefs();
  refs.forEach(r => {
    if (envKeys.indexOf(r) === -1) warnings.push(`"${r}" is referenced via \${${r}} in compose but is not defined in .env`);
  });
  if (state.meta.composeVersion === 'omit') {
    warnings.push('The compose "version" key is omitted (fine for Compose v2 — it is deprecated there).');
  }
  return { errors, warnings };
}

/* =========================================================================
   7. .env paste parser
   ========================================================================= */
function parseEnvText(text) {
  const pairs = [];
  const bad = [];
  String(text || '').split(/\r?\n/).forEach(rawLine => {
    const line0 = rawLine.trim();
    if (!line0 || line0.startsWith('#') || line0.startsWith('!')) return;
    let line = line0;
    if (/^export\s+/.test(line)) line = line.replace(/^export\s+/, '');
    const eq = line.indexOf('=');
    if (eq < 1) { bad.push(line0); return; }
    const key = line.slice(0, eq).trim();
    let val = line.slice(eq + 1).trim();
    if (/^["']/.test(val)) {
      const q = val[0];
      const end = val.indexOf(q, 1);
      val = end > 0 ? val.slice(1, end) : val.slice(1);
    } else {
      const h = val.indexOf(' #');
      if (h >= 0) val = val.slice(0, h).trim();
    }
    if (!KEY_RX.test(key)) { bad.push(line0); return; }
    pairs.push({ key, value: val });
  });
  return { pairs, bad };
}

/* =========================================================================
   8. Syntax highlighters (hand-rolled, line tokenizers)
   ========================================================================= */
const DOCKER_INSTRUCTIONS = ['FROM', 'RUN', 'CMD', 'LABEL', 'EXPOSE', 'ENV', 'ADD', 'COPY',
  'ENTRYPOINT', 'VOLUME', 'USER', 'WORKDIR', 'ARG', 'ONBUILD', 'STOPSIGNAL', 'HEALTHCHECK', 'SHELL', 'MAINTAINER'];
const RX_DOCKER_TOKEN = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|--[A-Za-z][\w-]*(?:=\S+)?|\b\d+(?:\.\d+)?\b)/g;
const RX_YAML_TOKEN = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|-?\b\d+(?:\.\d+)?\b|\b(?:true|false|yes|no|on|off|null|~)\b)/g;

function hlDockerLine(line) {
  if (/^\s*#/.test(line)) return [{ t: line, c: 'tok-cmt' }];
  const spans = [];
  let i = 0;
  const m = /^(\s*)([A-Za-z][A-Za-z0-9]*)(?=\s|$)/.exec(line);
  if (m && m[2] === m[2].toUpperCase() && DOCKER_INSTRUCTIONS.indexOf(m[2]) !== -1) {
    if (m[1]) spans.push({ t: m[1] });
    spans.push({ t: m[2], c: 'tok-kw' });
    i = m[0].length;
  }
  const re = RX_DOCKER_TOKEN;
  re.lastIndex = i;
  let last = i;
  let mm;
  while ((mm = re.exec(line))) {
    if (mm.index > last) spans.push({ t: line.slice(last, mm.index) });
    const tok = mm[0];
    const c = tok[0] === '"' || tok[0] === "'" ? 'tok-str' : (tok[0] === '-' ? 'tok-flag' : 'tok-num');
    spans.push({ t: tok, c });
    last = mm.index + tok.length;
    if (mm[0].length === 0) re.lastIndex++;
  }
  if (last < line.length) spans.push({ t: line.slice(last) });
  return spans;
}

function hlYamlLine(line) {
  if (/^\s*#/.test(line)) return [{ t: line, c: 'tok-cmt' }];
  const m = /^(\s*(?:-\s+)?)(#\s.*)$/.exec(line);
  if (m) return [{ t: m[1] || '' }, { t: m[2], c: 'tok-cmt' }];
  const spans = [];
  let i = 0;
  const km = /^(\s*(?:-\s+)?)([^\s:#"'[\]{}][^:]*?)(:)(\s|$)/.exec(line);
  if (km) {
    if (km[1]) spans.push({ t: km[1] });
    spans.push({ t: km[2], c: 'tok-key' });
    spans.push({ t: ':' });
    if (km[4]) spans.push({ t: km[4] });
    i = km[1].length + km[2].length + 1 + km[4].length;
  }
  const rest = line.slice(i);
  if (!rest) return spans;
  const re = RX_YAML_TOKEN;
  re.lastIndex = 0;
  let last = 0;
  let mm;
  while ((mm = re.exec(rest))) {
    if (mm.index > last) spans.push({ t: rest.slice(last, mm.index) });
    const tok = mm[0];
    let c;
    if (tok[0] === '"' || tok[0] === "'") c = 'tok-str';
    else if (/^(?:true|false|yes|no|on|off|null|~)$/i.test(tok)) c = 'tok-bool';
    else c = 'tok-num';
    spans.push({ t: tok, c });
    last = mm.index + tok.length;
    if (mm[0].length === 0) re.lastIndex++;
  }
  if (last < rest.length) spans.push({ t: rest.slice(last) });
  return spans;
}

/* =========================================================================
   9. Renderers
   ========================================================================= */
function activeStages() {
  return state.docker.multi ? state.docker.stages : state.docker.stages.slice(0, 1);
}
function imageInput(bind, value) {
  return textInput(bind, value, { list: 'dl-images', ph: 'node:20-alpine', aria: 'Base image' });
}

function buildSidebar() {
  const nav = document.getElementById('sidebar');
  nav.replaceChildren();
  SECTIONS.forEach(sec => {
    const b = h('button', { type: 'button', class: 'nav-btn', 'data-action': 'nav', 'data-arg': sec.id });
    const ico = h('span', { class: 'bico' });
    ico.append(icon(sec.icon, 17));
    const tx = h('span', { class: 'txt' });
    tx.textContent = sec.label;
    b.append(ico, tx);
    nav.append(b);
  });
  markNav();
}
function markNav() {
  document.querySelectorAll('.nav-btn').forEach(b => {
    if (b.dataset.arg === state.meta.activeSection) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}
function setSection(id) {
  state.meta.activeSection = id;
  markNav();
  renderSection();
  regen();
}

function renderSection() {
  const form = document.getElementById('form');
  const id = state.meta.activeSection || 'image';
  const def = SECTIONS.find(s => s.id === id) || SECTIONS[0];
  const scroll = form.scrollTop;
  form.replaceChildren();
  const title = h('h2', { class: 'sec-title' });
  const ico = h('span', { class: 'bico' });
  ico.append(icon(def.icon, 18));
  title.append(ico, def.title);
  form.append(title);
  const builder = BUILDERS[def.id] || BUILDERS.image;
  builder(form);
  form.scrollTop = scroll;
  markFieldErrors();
}

/* ---------- Image (Dockerfile) section ---------- */
function buildImageSection(form) {
  const multi = !!state.docker.multi;
  form.append(subLine('Describe the image to build. One instruction per line; long "RUN a && b" chains wrap with trailing backslashes.'));
  const bar = h('div', { class: 'row' });
  const swLabel = h('label', { class: 'switch-row' });
  swLabel.append(checkInput('docker.multi', multi, 'bool'));
  const swTxt = h('span');
  swTxt.textContent = 'Multi-stage build';
  swLabel.append(swTxt);
  swLabel.querySelector('input').setAttribute('data-rerender', '1');
  bar.append(swLabel);
  if (multi) bar.append(rowAdd('add-stage', '', 'Add stage'));
  form.append(bar);

  const stages = activeStages();
  if (multi) {
    form.append(hintNode('COPY steps can target a later stage with "COPY --from=<earlier stage>" — the list only offers earlier stages.'));
  }
  stages.forEach((st, idx) => form.append(stageCard(st, idx, multi)));
}
function stageCard(st, idx, multi) {
  const card = h('section', { class: 'card' });
  card.setAttribute('aria-label', multi ? 'Stage ' + (idx + 1) : 'Dockerfile');
  const head = h('div', { class: 'card-head' });
  head.append(h('p', { class: 'card-title' }, multi ? 'Stage ' + (idx + 1) : 'Image'));
  if (multi) {
    head.append(fld('Stage name', textInput(`docker.stages.${idx}.name`, st.name, { ph: 'builder' }),
      { err: `docker.stages.${idx}.name` }));
  }
  head.append(fld('Base image', imageInput(`docker.stages.${idx}.baseImage`, st.baseImage),
    { err: `docker.stages.${idx}.baseImage`, wide: true }));
  if (multi) {
    head.append(h('span', { class: 'spacer' }));
    head.append(rowDel('remove-stage', String(idx), 'Remove stage ' + (idx + 1)));
  }
  card.append(head);

  card.append(groupLabel('Build steps'));
  const ul = h('ul', { class: 'steps' });
  st.steps.forEach((s, j) => ul.append(stepRow(st, idx, s, j)));
  card.append(ul);
  card.append(h('div', { class: 'row' }, rowAdd('add-step', String(idx), 'Add step', false)));
  return card;
}

function stepRow(st, stageIdx, s, j) {
  const sp = `docker.stages.${stageIdx}.steps.${j}`;
  const li = h('li', { class: 'step-row' });
  li.dataset.stage = String(stageIdx);
  li.dataset.index = String(j);

  const head = h('div', { class: 'step-head' });
  // Purely a drag affordance (the ▲/▼ buttons are the keyboard path), so it is
  // hidden from the a11y tree rather than exposed as an inert pseudo-button.
  const grip = h('span', { class: 'grip', draggable: 'true', 'aria-hidden': 'true', title: 'Drag to reorder (or use the arrow buttons)' });
  grip.append(icon('grip', 15));
  const num = h('span', { class: 'step-num' });
  num.textContent = String(j + 1);
  const typeSel = selectInput(sp + '.type', s.type, STEP_TYPES.map(t => ({ v: t, label: t })), { rerender: true, aria: 'Instruction type' });
  typeSel.classList.add('mono');
  head.append(grip, num, typeSel, h('span', { class: 'spacer' }));
  const up = h('button', { type: 'button', class: 'btn ghost small icon-only', 'data-action': 'move-step', 'data-arg': `${stageIdx}:${j}:up`, 'aria-label': `Move step ${j + 1} up`, title: 'Move up', disabled: j === 0 ? '' : null });
  up.append(icon('chevup', 14));
  const down = h('button', { type: 'button', class: 'btn ghost small icon-only', 'data-action': 'move-step', 'data-arg': `${stageIdx}:${j}:down`, 'aria-label': `Move step ${j + 1} down`, title: 'Move down', disabled: j === st.steps.length - 1 ? '' : null });
  down.append(icon('chevdown', 14));
  head.append(up, down, rowDel('remove-step', `${stageIdx}:${j}`, `Delete step ${j + 1}`));
  li.append(head);

  const body = h('div', { class: 'step-body' });
  stepFields(sp, s, stageIdx).forEach(x => body.append(x));
  li.append(body);
  return li;
}

function stepFields(sp, s, stageIdx) {
  const out = [];
  const multi = !!state.docker.multi;
  switch (s.type) {
    case 'RUN':
      out.push(fld('Shell command', textInput(sp + '.cmd', s.cmd, { ph: 'apk add --no-cache curl' }),
        { hint: 'Chain with "&&" — long chains are emitted with trailing \\' }));
      break;
    case 'COPY': {
      const g = h('div', { class: 'grid2' });
      g.append(fld('Source path', textInput(sp + '.src', s.src, { ph: '.' })));
      g.append(fld('Destination path', textInput(sp + '.dest', s.dest, { ph: './app' })));
      g.append(fld('--chown (optional)', textInput(sp + '.chown', s.chown, { ph: '1000:1000' })));
      if (multi) {
        const earlier = state.docker.stages
          .map((x, i) => ({ v: x.name.trim(), i }))
          .filter(x => x.v && x.i < stageIdx);
        const opts = [{ v: '', label: '(none)' }].concat(earlier.map(x => ({ v: x.v })));
        const sel = selectInput(sp + '.from', s.from, opts, { aria: 'Copy from an earlier stage' });
        if (s.from && !earlier.some(x => x.v === s.from)) {
          const op = h('option', { value: s.from });
          op.textContent = s.from;
          sel.append(op);
          sel.value = s.from;
        }
        g.append(fld('--from stage', sel, { err: sp + '.from', hint: 'Earlier stages only' }));
      } else {
        if (s.from) g.append(fld('--from stage', textInput(sp + '.from', s.from, { rerender: false }), { err: sp + '.from', hint: 'Delete this value or enable multi-stage — --from needs named stages' }));
      }
      out.push(g);
      break;
    }
    case 'WORKDIR':
      out.push(fld('Working directory', textInput(sp + '.value', s.value, { ph: '/app' })));
      break;
    case 'USER':
      out.push(fld('User (and optional group)', textInput(sp + '.value', s.value, { ph: 'appuser' })));
      break;
    case 'ENV':
    case 'ARG':
      out.push(pairRows(sp, s.pairs, s.type === 'ARG'));
      break;
    case 'EXPOSE': {
      const g = h('div', { class: 'grid2' });
      g.append(fld('Port', textInput(sp + '.port', s.port, { ph: '8080' }), { err: sp + '.port' }));
      g.append(fld('Protocol', selectInput(sp + '.proto', s.proto, [{ v: 'tcp' }, { v: 'udp' }], { aria: 'Protocol' })));
      out.push(g);
      break;
    }
    case 'CMD':
    case 'ENTRYPOINT': {
      const g = h('div', { class: 'grid2' });
      g.append(fld('Form', selectInput(sp + '.style', s.style, [{ v: 'shell', label: 'Shell form' }, { v: 'exec', label: 'Exec form (JSON array)' }], { rerender: true, aria: 'Form' })));
      g.append(fld(s.style === 'exec' ? 'Arguments (comma-separated)' : 'Command (shell form)', textInput(sp + '.args', s.args, { ph: s.style === 'exec' ? 'node, index.js' : 'npm start' })));
      out.push(g);
      break;
    }
    case 'HEALTHCHECK': {
      const g = h('div', { class: 'grid2' });
      g.append(fld('Test command', textInput(`${sp}.hc.cmd`, s.hc.cmd, { ph: 'wget -qO- http://localhost/health || exit 1' })));
      g.append(fld('--interval', textInput(`${sp}.hc.interval`, s.hc.interval, { ph: '30s' })));
      g.append(fld('--timeout', textInput(`${sp}.hc.timeout`, s.hc.timeout, { ph: '5s' })));
      g.append(fld('--start-period', textInput(`${sp}.hc.startPeriod`, s.hc.startPeriod, { ph: '0s' })));
      g.append(fld('--retries', textInput(`${sp}.hc.retries`, s.hc.retries, { ph: '3' })));
      out.push(g);
      break;
    }
    default: break;
  }
  return out;
}

/* =========================================================================
   10. Edits (delegated) + state mutation cascades
   ========================================================================= */
function onEdit(el) {
  if (!el || !el.dataset || !el.dataset.field) return;
  const bind = el.dataset.field;
  const kind = el.dataset.kind;
  const isNameEdit = el.tagName === 'INPUT' && el.type === 'text' && /\.name$/.test(bind);
  const oldName = isNameEdit ? getAtPath(bind) : null;
  if (kind === 'list-toggle') {
    const list = getAtPath(bind);
    if (!Array.isArray(list)) return;
    const v = el.dataset.value;
    const ix = list.indexOf(v);
    if (el.checked && ix === -1) list.push(v);
    if (!el.checked && ix !== -1) list.splice(ix, 1);
  } else if (kind === 'radio') {
    if (el.checked) setAtPath(bind, el.dataset.value);
  } else if (kind === 'bool') {
    setAtPath(bind, el.checked);
  } else {
    setAtPath(bind, el.value);
  }

  // step-type switch: ensure an editable pair row for ENV/ARG
  const tm = /\.steps\.(\d+)\.type$/.exec(bind);
  if (tm) {
    const stage = state.docker.stages[+(bind.split('.')[2])];
    const step = stage && stage.steps[+tm[1]];
    if (step && (step.type === 'ENV' || step.type === 'ARG') && !step.pairs.length) {
      step.pairs.push({ id: uid(), k: '', v: '' });
    }
  }

  if (el.dataset.rerender) {
    renderSection();
    scheduleRegen();
    return;
  }
  if (isNameEdit) applyRename(oldName, bind, getAtPath(bind));
  scheduleRegen();
}

function applyRename(oldName, bind, newName) {
  if (!oldName || oldName === newName) return;
  if (/^docker\.stages\./.test(bind)) {
    const si = +bind.split('.')[2];
    state.docker.stages.forEach((st, j) => {
      if (j > si) st.steps.forEach(s => { if (s.from === oldName) s.from = newName; });
    });
    state.services.forEach(o => { if (o.buildTarget === oldName) o.buildTarget = newName; });
    document.querySelectorAll('#form select[data-field$=".buildTarget"]').forEach(sel => {
      Array.from(sel.options).forEach(op => {
        if (op.value === oldName) { op.value = newName; op.textContent = newName; }
      });
      if (sel.value === oldName) sel.value = newName;
    });
    document.querySelectorAll('#form select[data-field$=".from"]').forEach(sel => {
      Array.from(sel.options).forEach(op => {
        if (op.value === oldName) { op.value = newName; op.textContent = newName; }
      });
      if (sel.value === oldName) sel.value = newName;
    });
  } else if (/^services\./.test(bind)) {
    state.services.forEach(o => {
      o.dependsOn = o.dependsOn.map(d => d === oldName ? newName : d);
    });
    document.querySelectorAll('#form input[data-kind="list-toggle"][data-field$=".dependsOn"]').forEach(cb => {
      if (cb.dataset.value === oldName) {
        cb.dataset.value = newName;
        const tx = cb.parentElement && cb.parentElement.querySelector('.txt');
        if (tx) tx.textContent = newName;
      }
    });
  } else if (/^volumes\./.test(bind)) {
    state.services.forEach(o => {
      o.volumeMounts = o.volumeMounts.map(m => m.volume === oldName ? Object.assign(m, { volume: newName }) : m);
    });
    document.querySelectorAll('#form select[data-field$=".volume"]').forEach(sel => {
      Array.from(sel.options).forEach(op => {
        if (op.value === oldName) { op.value = newName; op.textContent = newName; }
      });
      if (sel.value === oldName) sel.value = newName;
    });
  } else if (/^networks\./.test(bind)) {
    state.services.forEach(o => {
      o.networks = o.networks.map(n => n === oldName ? newName : n);
    });
    document.querySelectorAll('#form input[data-kind="list-toggle"][data-field$=".networks"]').forEach(cb => {
      if (cb.dataset.value === oldName) {
        cb.dataset.value = newName;
        if (cb.parentElement && cb.parentElement.childNodes[1]) cb.parentElement.childNodes[1].textContent = newName;
      }
    });
  }
}
