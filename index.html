   ========================================================================= */
function newStage(i) {
  return {
    id: uid(),
    name: uniqueName('stage' + (state.docker.stages.length + (i || 0)), state.docker.stages.map(x => x.name.trim())),
    baseImage: '',
    steps: [],
  };
}
function newService() {
  const names = state.services.map(sv => sv.name.trim());
  return {
    id: uid(), name: uniqueName('service' + (state.services.length + 1), names), source: 'image',
    image: '', buildPath: '', dockerfileName: '', buildTarget: '',
    containerName: '', restart: 'no',
    ports: [], dependsOn: [], env: [], command: '', commandStyle: 'shell',
    healthcheck: { enabled: false, cmd: '', interval: '30s', timeout: '5s', retries: '3' },
    volumeMounts: [], networks: [],
  };
}

function moveStep(fromStage, from, toStage, to) {
  const stages = state.docker.stages;
  const srcSt = stages[fromStage];
  const dstSt = stages[toStage];
  if (!srcSt || !dstSt) return;
  const src = srcSt.steps;
  const [item] = src.splice(from, 1);
  if (!item) return;
  let idx = to;
  if (fromStage === toStage && from < to) idx = to - 1;
  if (idx > dstSt.steps.length) idx = dstSt.steps.length;
  if (idx < 0) idx = 0;
  dstSt.steps.splice(idx, 0, item);
  renderSection();
  regen();
}

function handleAction(btn) {
  const a = btn.dataset.action;
  const arg = btn.dataset.arg || '';
  switch (a) {
    case 'nav': setSection(arg); return;
    case 'tab': selectTab(btn.dataset.value === 'compose' ? 'compose' : 'dockerfile'); return;
    case 'theme': toggleTheme(); return;
    case 'reset': doReset(); return;
    case 'copy': copyActive(); return;
    case 'download': downloadActive(); return;
    case 'copy-run': copyText(dockerRunCmd(), 'the docker run command'); return;
    case 'add-stage':
      state.docker.stages.push(newStage());
      if (!state.docker.multi) state.docker.multi = true;
      renderSection(); regen();
      return;
    case 'remove-stage': {
      const i = +arg;
      if (!state.docker.stages[i]) return;
      let cleared = 0;
      state.docker.stages.splice(i, 1);
      if (!state.docker.stages.length) newStageInto();
      const names = state.docker.stages.map(x => x.name.trim());
      state.docker.stages.forEach(st => st.steps.forEach(s => {
        if (s.from && names.indexOf(s.from) === -1) { s.from = ''; cleared++; }
      }));
      let clearedTargets = 0;
      state.services.forEach(o => {
        if (o.buildTarget && names.indexOf(o.buildTarget) === -1) { o.buildTarget = ''; clearedTargets++; }
      });
      renderSection(); regen();
      const notes = [
        cleared ? 'cleared ' + cleared + ' dangling --from reference(s)' : '',
        clearedTargets ? 'cleared ' + clearedTargets + ' dangling build target(s)' : '',
      ].filter(Boolean).join(', ');
      toast('Stage removed' + (notes ? ' — ' + notes : ''));
      return;
    }
    case 'add-step': {
      const st = state.docker.stages[+arg];
      if (st) st.steps.push(makeStep('RUN'));
      renderSection(); regen();
      return;
    }
    case 'remove-step': {
      const [i, j] = arg.split(':').map(Number);
      const st = state.docker.stages[i];
      if (st) st.steps.splice(j, 1);
      renderSection(); regen();
      return;
    }
    case 'move-step': {
      const [i, j, dir] = arg.split(':');
      const st = state.docker.stages[+i];
      if (!st) return;
      const list = st.steps;
      const from = +j;
      const to = dir === 'up' ? from - 1 : from + 1;
      if (from < 0 || from >= list.length || to < 0 || to >= list.length) return;
      const item = list.splice(from, 1)[0];
      list.splice(to, 0, item);
      renderSection();
      regen();
      return;
    }
    case 'add-pair': {
      const target = getAtPath(arg);
      if (target && Array.isArray(target.pairs)) target.pairs.push({ id: uid(), k: '', v: '' });
      renderSection(); regen();
      return;
    }
    case 'remove-pair': {
      const [p, ix] = [arg.slice(0, arg.lastIndexOf(':')), +arg.slice(arg.lastIndexOf(':') + 1)];
      const target = getAtPath(p);
      if (target && Array.isArray(target.pairs)) target.pairs.splice(ix, 1);
      renderSection(); regen();
      return;
    }
    case 'add-service':
      state.services.push(newService());
      renderSection(); regen();
      return;
    case 'remove-service': {
      const i = +arg;
      const svc = state.services[i];
      if (!svc) return;
      const name = svc.name.trim();
      let scrubbed = 0;
      state.services.forEach((o, oi) => {
        if (oi !== i && o.dependsOn.indexOf(name) !== -1) {
          o.dependsOn = o.dependsOn.filter(d => d !== name);
          scrubbed++;
        }
      });
      state.services.splice(i, 1);
      renderSection(); regen();
      toast('Removed service "' + (name || '(unnamed)') + '"' + (scrubbed ? ' — removed ' + scrubbed + ' depends_on reference(s)' : ''));
      return;
    }
    case 'add-port': {
      const svc = state.services[+arg];
      if (svc) svc.ports.push({ id: uid(), host: '', container: '', proto: 'tcp' });
      renderSection(); regen();
      return;
    }
    case 'remove-port': {
      const [i, j] = arg.split(':').map(Number);
      const svc = state.services[i];
      if (svc) svc.ports.splice(j, 1);
      renderSection(); regen();
      return;
    }
    case 'add-envrow': {
      const svc = state.services[+arg];
      if (svc) svc.env.push({ id: uid(), key: '', value: '' });
      renderSection(); regen();
      return;
    }
    case 'remove-envrow': {
      const [i, j] = arg.split(':').map(Number);
      const svc = state.services[i];
      if (svc) svc.env.splice(j, 1);
      renderSection(); regen();
      return;
    }
    case 'load-env': {
      const svc = state.services[+arg];
      if (!svc) return;
      let added = 0;
      state.envFile.forEach(r => {
        const k = r.key.trim();
        if (!k) return;
        if (svc.env.some(e => e.key.trim() === k || e.value.trim() === '${' + k + '}')) return;
        svc.env.push({ id: uid(), key: k, value: '${' + k + '}' });
        added++;
      });
      renderSection(); regen();
      toast(added ? 'Added ' + added + ' ${KEY} reference row(s) from .env' : 'All .env keys are already referenced');
      return;
    }
    case 'add-mount': {
      const svc = state.services[+arg];
      if (svc) svc.volumeMounts.push({ id: uid(), volume: '', target: '' });
      renderSection(); regen();
      return;
    }
    case 'remove-mount': {
      const [i, j] = arg.split(':').map(Number);
      const svc = state.services[i];
      if (svc) svc.volumeMounts.splice(j, 1);
      renderSection(); regen();
      return;
    }
    case 'add-vol':
      state.volumes.push({ id: uid(), name: uniqueName('app-vol' + (state.volumes.length + 1), state.volumes.map(v => v.name.trim())), driver: 'local', driverOpts: [] });
      renderSection(); regen();
      return;
    case 'remove-vol': {
      const i = +arg;
      const v = state.volumes[i];
      if (!v) return;
      const name = v.name.trim();
      let detached = 0;
      if (name) state.services.forEach(s => {
        const before = s.volumeMounts.length;
        s.volumeMounts = s.volumeMounts.filter(m => m.volume !== name);
        detached += before - s.volumeMounts.length;
      });
      state.volumes.splice(i, 1);
      renderSection(); regen();
      toast('Removed volume' + (name ? ' "' + name + '"' : '') + (detached ? ' — detached from ' + detached + ' service mount(s)' : ''));
      return;
    }
    case 'add-vopt': {
      const v = state.volumes[+arg];
      if (v) v.driverOpts.push({ id: uid(), k: '', v: '' });
      renderSection(); regen();
      return;
    }
    case 'remove-vopt': {
      const [i, j] = arg.split(':').map(Number);
      const v = state.volumes[i];
      if (v) v.driverOpts.splice(j, 1);
      renderSection(); regen();
      return;
    }
    case 'add-net':
      state.networks.push({ id: uid(), name: uniqueName('net' + (state.networks.length + 1), state.networks.map(n => n.name.trim())), driver: '', subnet: '' });
      renderSection(); regen();
      return;
    case 'remove-net': {
      const i = +arg;
      const n = state.networks[i];
      if (!n) return;
      const name = n.name.trim();
      let detached = 0;
      if (name) state.services.forEach(s => {
        const before = s.networks.length;
        s.networks = s.networks.filter(x => x !== name);
        detached += before - s.networks.length;
      });
      state.networks.splice(i, 1);
      renderSection(); regen();
      toast('Removed network' + (name ? ' "' + name + '"' : '') + (detached ? ' — detached from ' + detached + ' service(s)' : ''));
      return;
    }
    case 'add-envkey':
      state.envFile.push({ id: uid(), key: '', value: '' });
      renderSection(); regen();
      return;
    case 'remove-envkey': {
      state.envFile.splice(+arg, 1);
      renderSection(); regen();
      return;
    }
    case 'env-import': {
      const ta = document.getElementById('env-paste');
      if (!ta) return;
      const parsed = parseEnvText(ta.value);
      let updated = 0;
      parsed.pairs.forEach(pr => {
        const ex = state.envFile.find(e => e.key.trim() === pr.key);
        if (ex) { ex.value = pr.value; updated++; }
        else state.envFile.push({ id: uid(), key: pr.key, value: pr.value });
      });
      ta.value = '';
      renderSection(); regen();
      toast('Imported ' + parsed.pairs.length + ' key(s)' + (updated ? ' (' + updated + ' updated)' : '') + (parsed.bad.length ? ' — ' + parsed.bad.length + ' line(s) skipped' : ''), parsed.bad.length ? 'err' : 'ok');
      return;
    }
    case 'copy-env': copyText(envFileText(), 'the .env content'); return;
    default: return;
  }
}
function newStageInto() {
  state.docker.stages.push({ id: uid(), name: 'stage1', baseImage: '', steps: [] });
}

/* =========================================================================
   12. Preview, errors, persistence
   ========================================================================= */
const PREVIEWS = { dockerfile: '', compose: '' };
let lastValidation = { errors: [], warnings: [] };

function regen() {
  const v = validate();
  lastValidation = v;
  PREVIEWS.dockerfile = emitDockerfile();
  PREVIEWS.compose = emitComposeYaml();
  renderPreview();
  markFieldErrors();
  updateEnvPreview();
  save();
}

function renderPreview() {
  const tab = state.meta.activeTab === 'compose' ? 'compose' : 'dockerfile';
  const text = PREVIEWS[tab] || '';
  const out = document.getElementById('code-out');
  out.replaceChildren();
  const lines = text.length ? text.replace(/\n$/, '').split('\n') : [''];
  for (const line of lines) {
    const spans = tab === 'dockerfile' ? hlDockerLine(line) : hlYamlLine(line);
    for (const sp of spans) {
      const el = h('span');
      if (sp.c) el.className = sp.c;
      el.textContent = sp.t;
      out.append(el);
    }
    out.append(document.createTextNode('\n'));
  }
  const errBanner = document.getElementById('banner-err');
  const warnBanner = document.getElementById('banner-warn');
  errBanner.replaceChildren();
  warnBanner.replaceChildren();
  const nErr = lastValidation.errors.length;
  if (nErr) {
    errBanner.append(h('strong'), `${nErr} validation error${nErr === 1 ? '' : 's'} — download is blocked:`);
    const ul = h('ul');
    lastValidation.errors.forEach(e => {
      const li = h('li');
      li.textContent = e.msg;
      ul.append(li);
    });
    errBanner.append(ul);
    errBanner.hidden = false;
  } else {
    errBanner.hidden = true;
  }
  if (lastValidation.warnings.length) {
    warnBanner.append(h('strong'), 'Warnings:');
    const ul = h('ul');
    lastValidation.warnings.forEach(w => {
      const li = h('li');
      li.textContent = w;
      ul.append(li);
    });
    warnBanner.append(ul);
    warnBanner.hidden = false;
  } else {
    warnBanner.hidden = true;
  }

  const dl = document.getElementById('btn-dl');
  dl.disabled = nErr > 0;
  dl.title = nErr ? 'Fix the validation errors above to enable download' : 'Download ' + (tab === 'compose' ? 'docker-compose.yml' : 'Dockerfile');
  document.getElementById('btn-copy').title = 'Copy ' + (tab === 'compose' ? 'docker-compose.yml' : 'the Dockerfile') + ' to the clipboard';

  document.getElementById('gen-status').textContent =
    (tab === 'compose' ? 'docker-compose.yml' : 'Dockerfile') + ' updated · ' + lines.length + ' lines · ' +
    (nErr === 0 ? '0 errors' : nErr + ' error' + (nErr === 1 ? '' : 's')) +
    (lastValidation.warnings.length ? ' · ' + lastValidation.warnings.length + ' warning(s)' : '');
}

function markFieldErrors() {
  const map = new Map();
  lastValidation.errors.forEach(e => { if (e.path && !map.has(e.path)) map.set(e.path, e.msg); });
  document.querySelectorAll('#form [data-err]').forEach(el => {
    const p = el.getAttribute('data-err');
    const bad = map.get(p) || null;
    if (bad) el.classList.add('invalid');
    else el.classList.remove('invalid');
    el.setAttribute('aria-invalid', bad ? 'true' : 'false');
    const box = document.getElementById(errId(p));
    if (box) {
      box.hidden = !bad;
      box.textContent = bad || '';
    }
  });
}

function updateEnvPreview() {
  const el = document.getElementById('env-raw');
  if (el) el.textContent = envFileText();
}

const debounceDelayMs = 150;
function debounce(fn, ms) {
  let t = null;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}
const scheduleRegen = debounce(regen, debounceDelayMs);

/* =========================================================================
   13. Preview actions: copy, download, tabs
   ========================================================================= */
function activeText() {
  return PREVIEWS[state.meta.activeTab === 'compose' ? 'compose' : 'dockerfile'] || '';
}
function copyText(text, label) {
  const done = ok => toast(ok ? 'Copied ' + label : 'Copy failed — select the text in the preview manually', ok ? 'ok' : 'err');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true), fallback);
  } else {
    fallback();
  }
}
function copyActive() {
  copyText(activeText(), state.meta.activeTab === 'compose' ? 'docker-compose.yml' : 'the Dockerfile');
}
function downloadActive() {
  if (lastValidation.errors.length) {
    toast('Resolve the ' + lastValidation.errors.length + ' validation error(s) to enable download', 'err');
    return;
  }
  const tab = state.meta.activeTab === 'compose' ? 'compose' : 'dockerfile';
  const text = activeText();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = tab === 'compose' ? 'docker-compose.yml' : 'Dockerfile';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Downloaded ' + (tab === 'compose' ? 'docker-compose.yml' : 'Dockerfile'));
}

function selectTab(t) {
  t = t === 'compose' ? 'compose' : 'dockerfile';
  state.meta.activeTab = t;
  const dBtn = document.getElementById('tab-dockerfile');
  const cBtn = document.getElementById('tab-compose');
  dBtn.setAttribute('aria-selected', t === 'dockerfile' ? 'true' : 'false');
  cBtn.setAttribute('aria-selected', t === 'compose' ? 'true' : 'false');
  dBtn.tabIndex = t === 'dockerfile' ? 0 : -1;
  cBtn.tabIndex = t === 'compose' ? 0 : -1;
  document.getElementById('code-panel').setAttribute('aria-labelledby', 'tab-' + t);
  regen();
}

/* =========================================================================
   14. Theme, reset, toast
   ========================================================================= */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const holder = document.getElementById('theme-ico');
  if (holder) {
    holder.replaceChildren();
    holder.append(icon(t === 'dark' ? 'sun' : 'moon', 16));
  }
  const btn = document.getElementById('theme-btn');
  if (btn) btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  saveRaw(THEME_KEY, t);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  toast('Switched to the ' + next + ' theme');
}
function doReset() {
  if (!confirm('Reset all configuration back to the sample project? This cannot be undone.')) return;
  state = seedState();
  save();
  markNav();
  renderSection();
  selectTab(state.meta.activeTab);
  toast('Reset to the sample configuration');
}

let toastTimer = null;
function toast(msg, kind = 'ok') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'show ' + (kind || 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}

/* =========================================================================
   15. Event wiring + drag-to-reorder
   ========================================================================= */
let dragInfo = null;

function wireTypeEdits(form) {
  form.addEventListener('input', e => onEdit(e.target));
  form.addEventListener('change', e => {
    const t = e.target;
    if (t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'TEXTAREA') onEdit(t);
  });
}

function wireDragAndDrop(form) {
  form.addEventListener('dragstart', e => {
    const grip = e.target.closest && e.target.closest('.grip');
    if (!grip) return;
    const row = grip.closest('.step-row');
    if (!row) return;
    dragInfo = { stage: +row.dataset.stage, index: +row.dataset.index };
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'docker-ui-step'); } catch (err) { /* ignore */ }
    row.classList.add('dragging');
    if (e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(row, 20, 12);
  });
  form.addEventListener('dragover', e => {
    if (!dragInfo) return;
    const row = e.target.closest && e.target.closest('.step-row');
    if (!row) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.step-row.drop-target').forEach(x => x.classList.remove('drop-target'));
    row.classList.add('drop-target');
  });
  form.addEventListener('drop', e => {
    const row = e.target.closest && e.target.closest('.step-row');
    if (!dragInfo || !row) { dragInfo = null; return; }
    e.preventDefault();
    const toStage = +row.dataset.stage;
    const toIndex = +row.dataset.index;
    moveStep(dragInfo.stage, dragInfo.index, toStage, toIndex);
    dragInfo = null;
    document.querySelectorAll('.step-row').forEach(x => x.classList.remove('dragging', 'drop-target'));
  });
  form.addEventListener('dragend', () => {
    dragInfo = null;
    document.querySelectorAll('.step-row').forEach(x => x.classList.remove('dragging', 'drop-target'));
  });
}

function wireTabs() {
  const tablist = document.getElementById('tablist');
  tablist.addEventListener('keydown', e => {
    const keys = ['ArrowRight', 'ArrowLeft', 'Home', 'End'];
    if (keys.indexOf(e.key) === -1) return;
    const tabs = [document.getElementById('tab-dockerfile'), document.getElementById('tab-compose')];
    const cur = tabs.indexOf(document.activeElement);
    if (cur === -1) return;
    e.preventDefault();
    let next = cur;
    if (e.key === 'ArrowRight') next = (cur + 1) % tabs.length;
    if (e.key === 'ArrowLeft') next = (cur + tabs.length - 1) % tabs.length;
    if (e.key === 'Home') next = 0;
    if (e.key === 'End') next = tabs.length - 1;
    selectTab(next === 0 ? 'dockerfile' : 'compose');
    tabs[next].focus();
  });
}

function wireEvents() {
  const form = document.getElementById('form');
  wireTypeEdits(form);
  wireDragAndDrop(form);
  wireTabs();
  document.addEventListener('click', e => {
    const btn = e.target.closest && e.target.closest('[data-action]');
    if (btn && !btn.disabled) handleAction(btn);
  });
}

/* =========================================================================
   16. Bootstrap
   ========================================================================= */
function buildPresets() {
  const dl = document.getElementById('dl-images');
  dl.replaceChildren();
  IMAGE_PRESETS.forEach(p => dl.append(h('option', { value: p })));
}
function initStaticIcons() {
  document.querySelectorAll('.bico[data-ico]').forEach(sp => {
    sp.append(icon(sp.dataset.ico, 14));
  });
  const brand = document.querySelector('.brand .bico');
  if (brand && !brand.childNodes.length) brand.append(icon('cube', 20));

function init() {
  state = loadState();
  applyTheme(loadTheme());
  buildPresets();
  buildSidebar();
  initStaticIcons();
  renderSection();
  selectTab(state.meta.activeTab);
  wireEvents();
}

if (typeof document !== 'undefined' && document.getElementById && document.getElementById('form')) {
  init();
}
