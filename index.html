<!DOCTYPE html>
<!--
  Docker UI — single-file, zero-dependency visual editor for Dockerfiles & docker-compose.yml.
  Open this file directly in a browser (file:// works); there is no server, no build step, and
  the page makes zero network requests. Vanilla JS (ES2020) + CSS only.

  FILE STRUCTURE
  ─ <style>   Theme CSS custom properties (dark default, [data-theme="light"] override),
              three-pane grid (260px sidebar | fluid form | ≥380px preview), form controls,
              repeater rows, preview/token colors, responsive breakpoints (≤1100px, ≤900px
              stacks vertically with a horizontal chip nav), prefers-reduced-motion guard.
  ─ <body>    Topbar (title, theme toggle, Reset) · <aside> section nav (Image / Compose /
              Volumes / Networks / Environment) · <main> form panel (renders the active
              section) · <section> preview (ARIA tablist: Dockerfile / docker-compose.yml,
              Copy+Download, error & warning banners, aria-live status line) · toast ·
              image <datalist>.
  ─ <script>  One IIFE, in order:
      1) constants  — step-type list, restart policies, sidebar sections, SVG icon paths
      2) state      — seed/normalize, localStorage persistence ("docker-ui-state-v2",
                      theme "docker-ui-theme"), try/catch + in-memory fallback
      3) generators — hand-rolled YAML emitter (no JSON.stringify), Dockerfile emitter
                      (continuation wrapping, FROM … AS, COPY --from), .env parser,
                      docker-run synthesizer
      4) validator  — errors E1–E8 + warnings, field-path anchored
      5) highlight  — hand-rolled per-tab tokenizers (Dockerfile, YAML)
      6) DOM helpers, section renderers, repeaters (drag-to-reorder + ▲/▼ buttons)
      7) preview    — tabs, syntax highlight, Copy / Download / docker run, banners
      8) wiring     — delegated input & click handling, 150 ms debounced regenerate +
                      persist, bootstrap (restore-or-seed from localStorage)

  Data flow: any input → state mutation → 150 ms debounce → validate → generate →
  highlight → preview → persist. Value edits never re-render the form (focus is kept);
  structural edits (add/remove/reorder/toggle) re-render the active section.
  Validation errors block Download (Copy + preview stay live); warnings never block.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker UI — Dockerfile &amp; Compose builder</title>

<style>
/* ── Theme tokens ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0f1117; --panel:#171a21; --panel2:#1d2230; --input-bg:#0d0f15; --code-bg:#0b0d13;
  --border:#262b36; --border-soft:#20242e;
  --text:#e7eaf2; --text-dim:#98a2b3;
  --accent:#4f8cff; --accent-ink:#7aa7ff; --accent-soft:rgba(79,140,255,.14);
  --error:#ff5d5d; --error-soft:rgba(255,93,93,.1);
  --success:#3ecf8e; --warn:#f0b429; --warn-soft:rgba(240,180,41,.1);
  --tk-com:#697487; --tk-kw:#6ea3ff; --tk-str:#3ecf8e; --tk-num:#f0b429; --tk-bool:#ef8fd2;
  --tk-key:#8fb4ff; --tk-flag:#c9a7f0; --tk-dash:#7f8ca3;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --radius:6px; --tr:130ms;
}
[data-theme="light"]{
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#eef1f7; --input-bg:#ffffff; --code-bg:#f7f9fd;
  --border:#d8dee9; --border-soft:#e4e8ef;
  --text:#1b2333; --text-dim:#5c6779;
  --accent-ink:#3560c0; --accent-soft:rgba(79,140,255,.13);
  --error:#d84a4a; --error-soft:rgba(216,74,74,.08);
  --success:#189a63; --warn:#a97400; --warn-soft:rgba(176,124,10,.09);
  --tk-com:#8a93a5; --tk-kw:#2f62d8; --tk-str:#128a55; --tk-num:#a35a00; --tk-bool:#c1378d;
  --tk-key:#3555bf; --tk-flag:#7c3aed; --tk-dash:#8a93a5;
}

/* ── Shell / three-pane grid ──────────────────────────────────────────────── */
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
.app{
  display:grid;
  grid-template-columns:260px minmax(0,1fr) minmax(380px,42%);
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "side form prev";
  height:100vh; max-width:2560px; margin:0 auto;
}
.topbar{grid-area:top;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--panel);border-bottom:1px solid var(--border);padding:8px 14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.brand .sub{color:var(--text-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}

.sidebar{grid-area:side;background:var(--panel);border-right:1px solid var(--border);
  overflow-y:auto;display:flex;flex-direction:column}
#nav{display:flex;flex-direction:column;gap:4px;padding:10px}
.nav-btn{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:1px solid transparent;
  border-radius:var(--radius);padding:9px 10px;cursor:pointer;color:var(--text-dim);
  transition:background var(--tr),color var(--tr)}
.nav-btn:hover{background:var(--panel2);color:var(--text)}
.nav-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-btn svg{flex:0 0 auto}
.side-foot{margin-top:auto;padding:10px 12px;color:var(--text-dim);font-size:11px;border-top:1px solid var(--border-soft)}

.panel-form{grid-area:form;overflow-y:auto;padding:16px 18px 56px}
.panel-preview{grid-area:prev;display:flex;flex-direction:column;min-width:0;
  background:var(--panel);border-left:1px solid var(--border)}

/* ── Section headers / cards ──────────────────────────────────────────────── */
.sec-head{display:flex;align-items:center;gap:9px;margin:2px 0 4px}
.sec-head h2{font-size:15px;margin:0;font-weight:650}
.sec-desc{color:var(--text-dim);font-size:12.5px;margin:0 0 14px;max-width:72ch}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:0 0 12px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-head h3{font-size:12.5px;margin:0;color:var(--text-dim);font-weight:650;letter-spacing:.3px}
.spacer{flex:1}
.controls{display:flex;gap:6px}
.group{border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin:0 0 10px}
.group>.flabel{display:block;margin-bottom:7px}

/* ── Form fields ──────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.flabel{font-size:12px;color:var(--text-dim)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.grid-gap{display:flex;flex-direction:column;gap:9px}
.inp{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);padding:7px 10px;font:inherit;min-height:34px;
  transition:border-color var(--tr),box-shadow var(--tr)}
.inp.mono,textarea.inp{font-family:var(--mono);font-size:12.8px}
.inp::placeholder{color:var(--text-dim);opacity:.72}
select.inp{width:auto;min-width:120px;padding-right:28px}
textarea.inp{resize:vertical;min-height:58px}
.chk{width:16px;height:16px;accent-color:var(--accent)}
.toggle-label{display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:600;font-size:13px}
.radio-group{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.radio-group>.flabel{width:100%}
.mono-lbl span{font-family:var(--mono);font-size:12.3px}
.radio-opt{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;
  border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;background:var(--input-bg)}
.radio-opt input{accent-color:var(--accent);margin:0}
.hint{color:var(--text-dim);font-size:12px;margin-top:2px}
.field-error{color:var(--error);font-size:12px;margin-top:4px;flex-basis:100%}
.inv .inp{border-color:var(--error)}

/* ── Repeaters & step rows ────────────────────────────────────────────────── */
.rep{display:flex;flex-direction:column;gap:8px}
.rep-list{display:flex;flex-direction:column;gap:8px}
.rep-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.rep-row .inp{width:auto;flex:1 1 130px;min-width:90px}
.rep-row .btn{flex:0 0 auto}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step-row{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);
  border:1px solid var(--border);border-radius:var(--radius);padding:9px}
.step-row.dragging{opacity:.4}
.step-row.drop-above{box-shadow:0 -2px 0 0 var(--accent)}
.step-row.drop-below{box-shadow:0 2px 0 0 var(--accent)}
.step-fields{flex:1 1 auto;display:flex;flex-direction:column;gap:9px;min-width:0}
.type-sel{flex:0 0 130px;width:auto;min-width:130px}
.grip{cursor:grab;color:var(--text-dim);padding:5px 2px;flex:0 0 auto;touch-action:none}

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius);border:1px solid var(--border);
  background:transparent;color:var(--text);padding:7px 12px;cursor:pointer;min-height:34px;
  transition:background var(--tr),border-color var(--tr),color var(--tr)}
.btn:hover:enabled{border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover:enabled{color:#fff}
.btn-danger:hover:enabled{color:var(--error);border-color:var(--error);background:var(--error-soft)}
.btn-ico{padding:6px;min-height:0}
.btn-sm{padding:5px 10px;min-height:30px;font-size:13px}

/* ── Preview panel ────────────────────────────────────────────────────────── */
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.pv-tabs{display:flex;gap:4px}
.pv-tab{background:none;border:1px solid transparent;border-radius:var(--radius);padding:6px 11px;
  cursor:pointer;color:var(--text-dim);font-family:var(--mono);font-size:12.5px;
  transition:color var(--tr),background var(--tr),box-shadow var(--tr)}
.pv-tab:hover{color:var(--text)}
.pv-tab[aria-selected="true"]{background:var(--panel2);color:var(--text);border-color:var(--border);
  box-shadow:0 1px 5px rgba(0,0,0,.35)}
[data-theme="light"] .pv-tab[aria-selected="true"]{box-shadow:0 1px 4px rgba(15,17,23,.12)}
.pv-actions{display:flex;gap:8px;align-items:center}
.pv-status{padding:6px 12px;color:var(--text-dim);font-size:12px;font-family:var(--mono);
  border-bottom:1px solid var(--border-soft);min-height:27px}
.pv-banners{padding:0 12px}
.banner{display:flex;gap:8px;align-items:flex-start;border-radius:var(--radius);border:1px solid;
  padding:8px 10px;margin:8px 0;font-size:12.5px}
.banner svg{flex:0 0 auto;margin-top:1px}
.banner-err{color:var(--error);border-color:var(--error);background:var(--error-soft)}
.banner-warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.banner .blist{display:flex;flex-direction:column;gap:3px;margin-top:6px;word-break:break-word}
.pv-scroll{flex:1;min-height:0;overflow:auto}
.pv-scroll pre{margin:0;padding:12px 14px 30px;min-height:100%}
.pv-scroll code{font-family:var(--mono);font-size:12.6px;line-height:1.55;white-space:pre;display:block}
.tk-com{color:var(--tk-com);font-style:italic}
.tk-kw{color:var(--tk-kw);font-weight:600}
.tk-str{color:var(--tk-str)}
.tk-num{color:var(--tk-num)}
.tk-bool{color:var(--tk-bool)}
.tk-key{color:var(--tk-key)}
.tk-flag{color:var(--tk-flag)}
.tk-dash{color:var(--tk-dash)}

/* ── Toast, misc ──────────────────────────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,8px);background:var(--panel);
  border:1px solid var(--accent);color:var(--text);padding:8px 14px;border-radius:var(--radius);
  font-size:13px;opacity:0;pointer-events:none;transition:opacity var(--tr),transform var(--tr);
  z-index:50;max-width:min(90vw,480px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.visually-hidden{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── Focus rings ──────────────────────────────────────────────────────────── */
.btn:focus-visible,.nav-btn:focus-visible,.pv-tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[tabindex="0"]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── Responsive ───────────────────────────────────────────────────────────── */
@media (max-width:1100px){
  .app{grid-template-columns:230px minmax(0,1fr) minmax(320px,40%)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:repeat(4,auto);
    grid-template-areas:"top" "side" "form" "prev";height:auto}
  .sidebar{border-right:0;border-bottom:1px solid var(--border);overflow:visible}
  #nav{flex-direction:row;overflow-x:auto;padding:8px;gap:6px}
  .nav-btn{flex:0 0 auto}
  .nav-btn span{white-space:nowrap}
  .panel-form,.panel-preview{overflow:visible}
  .panel-preview{border-left:0;border-top:1px solid var(--border)}
  .pv-scroll{max-height:60vh}
  .side-foot{display:none}
}
@media (max-width:620px){
  .row2,.row3{grid-template-columns:1fr}
  .rep-row .inp{flex:1 1 100%}
  .brand .sub{display:none}
  .panel-form{padding:12px 12px 48px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

<script>
(() => {
'use strict';

// __PURE_START__

/* ═══ 1 · Constants ═════════════════════════════════════════════════════════ */

const IDENT = /^[A-Za-z0-9][A-Za-z0-9_.-]*$/;
const STEP_TYPES = ['RUN','COPY','WORKDIR','ENV','ARG','EXPOSE','USER','CMD','ENTRYPOINT','HEALTHCHECK'];
const STORAGE_SCHEMA = 2;

/* ═══ 2 · Tiny pure helpers ═════════════════════════════════════════════════ */

let seq = 0;
function uid(){ return 'x' + (++seq) + '-' + Math.random().toString(36).slice(2, 8); }

function getIn(obj, path){
  return String(path).split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setIn(obj, path, val){
  const ks = String(path).split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++){ o = o[ks[i]]; if (o == null) return obj; }
  o[ks[ks.length - 1]] = val;
  return obj;
}

/* Keeps references consistent when a service / volume / network / stage is renamed:
   depends_on lists, volume mounts, network attachments and COPY --from targets. */
function renameRefs(s, path, oldV, newV){
  const m = /(?:^|\.)(services|volumes|networks|stages)\.(\d+)\.name$/.exec(String(path || ''));
  if (!m || oldV == null || oldV === '' || newV === oldV) return s;
  const kind = m[1];
  const o = String(oldV), n = String(newV == null ? '' : newV);
  if (!n) return s;
  if (kind === 'services') (s.services || []).forEach(sv => { sv.dependsOn = (sv.dependsOn || []).map(x => x === o ? n : x); });
  if (kind === 'volumes')  (s.services || []).forEach(sv => { sv.volumeMounts = (sv.volumeMounts || []).map(x => x.volume === o ? Object.assign({}, x, {volume: n}) : x); });
  if (kind === 'networks')(s.services || []).forEach(sv => { sv.networks = (sv.networks || []).map(x => x === o ? n : x); });
  if (kind === 'stages')   (s.docker.stages || []).forEach(st => (st.steps || []).forEach(sp => { if (sp.from === o) sp.from = n; }));
  return s;
}

/* ═══ 3 · Seed & shape ══════════════════════════════════════════════════════ */

function newService(name){
  return {
    id: uid(), name: name || '', source: 'build', image: '',
    buildPath: '.', buildDockerfile: '', buildTarget: '',
    containerName: '', restart: '',
    ports: [], dependsOn: [], env: [], command: '',
    healthcheck: { enabled: false, test: '', interval: '30s', timeout: '3s', retries: '3' },
    volumeMounts: [], networks: []
  };
}

function seedState(){
  return {
    schema: STORAGE_SCHEMA,
    theme: 'dark',
    version: '3.8',
    activeSection: 'image',
    activeTab: 'dockerfile',
    docker: {
      singleBaseImage: 'node:20-alpine',
      multiStage: false,
      steps: [
        { id: uid(), type: 'WORKDIR', path: '/app' },
        { id: uid(), type: 'COPY', src: '.', dest: '.', chown: '', from: '' },
        { id: uid(), type: 'RUN', command: 'npm ci --omit=dev' },
        { id: uid(), type: 'CMD', mode: 'exec', exec: 'node\nindex.js', shell: '' }
      ],
      stages: [
        { id: uid(), name: 'build', baseImage: 'node:20-alpine', steps: [
          { id: uid(), type: 'COPY', src: '.', dest: '/app', chown: '', from: '' },
          { id: uid(), type: 'RUN', command: 'npm ci --omit=dev' }
        ] },
        { id: uid(), name: 'runtime', baseImage: 'node:20-alpine', steps: [
          { id: uid(), type: 'COPY', src: '/app', dest: '/app', chown: '', from: 'build' },
          { id: uid(), type: 'CMD', mode: 'exec', exec: 'node\nindex.js', shell: '' }
        ] }
      ]
    },
    services: (() => {
      const app = newService('app');
      app.ports = [{ id: uid(), host: '3000', container: '3000', proto: 'tcp' }];
      app.volumeMounts = [{ id: uid(), volume: 'app-data', target: '/data', readonly: false }];
      return [app];
    })(),
    volumes:  [{ id: uid(), name: 'app-data', driver: 'local', driverOpts: [] }],
    networks: [],
    dotenv:   []
  };
}

function normalize(s){
  const seed = seedState();
  ['theme','version','activeSection','activeTab','docker','services','volumes','networks','dotenv'].forEach(k => {
    if (s[k] === undefined) s[k] = seed[k];
  });
  if (!s.docker || typeof s.docker !== 'object') s.docker = seed.docker;
  ['singleBaseImage','multiStage','steps','stages'].forEach(k => {
    if (s.docker[k] === undefined) s.docker[k] = seed.docker[k];
  });
  ['services','volumes','networks','dotenv'].forEach(k => {
    if (!Array.isArray(s[k])) s[k] = seed[k];
  });
  if (!Array.isArray(s.docker.steps)) s.docker.steps = [];
  if (!Array.isArray(s.docker.stages)) s.docker.stages = [];
  s.services.forEach(svc => {
    ['ports','dependsOn','env','volumeMounts','networks'].forEach(k => { if (!Array.isArray(svc[k])) svc[k] = []; });
    if (!svc.healthcheck || typeof svc.healthcheck !== 'object') svc.healthcheck = { enabled: false, test: '', interval: '30s', timeout: '3s', retries: '3' };
  });
  (s.volumes || []).forEach(v => { if (!Array.isArray(v.driverOpts)) v.driverOpts = []; });
  return s;
}

/* ═══ 4 · YAML emitter (hand-rolled — no JSON.stringify) ════════════════════ */

function yDq(s){
  return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

function yNeedsQuote(s){
  if (s === '') return true;
  if (/^\s|\s$/.test(s)) return true;
  if (s.includes(':') || s.includes('#')) return true;
  if ('-?:,[]{}#&*!|>\'"%@`'.indexOf(s[0]) >= 0) return true;
  if (/^(y|Y|n|N|yes|no|true|false|on|off|null|~)$/i.test(s)) return true;
  if (/^[+-]?(\d[\d_]*(\.\d*)?([eE][+-]?\d+)?|\.\d+|(\d[\d_]*)?\.(\d+|inf|Inf|INF)|\.nan)$/.test(s)) return true;
  if (/^0[\d_]/.test(s)) return true;
  return false;
}

function yScalar(v){
  const s = String(v == null ? '' : v);
  if (s === '') return '""';
  if (yNeedsQuote(s)) return yDq(s);
  return s;
}

/* ═══ 5 · Small parsers ═════════════════════════════════════════════════════ */

/* If the string is a JSON array literal, return its string elements (exec form). */
function parseExecJson(t){
  const s = String(t == null ? '' : t).trim();
  if (!s.startsWith('[')) return null;
  try {
    const v = JSON.parse(s);
    return Array.isArray(v) ? v.map(String) : null;
  } catch (_) { return null; }
}

/* .env paste import: KEY=VALUE lines; # / ! comments, blank lines and “export ”
   prefixes ignored; quotes and inner “#” preserved verbatim (dotenv semantics). */
function parseDotenv(text){
  const out = [];
  String(text == null ? '' : text).split(/\r?\n/).forEach(raw => {
    let s = raw.trim();
    if (!s || s[0] === '#' || s[0] === '!') return;
    if (/^export\s/.test(s)) s = s.replace(/^export\s+/, '');
    const eq = s.indexOf('=');
    if (eq < 1) return;
    const k = s.slice(0, eq).trim();
    if (!k) return;
    out.push({ key: k, value: s.slice(eq + 1).trim() });
  });
  return out;
}

/* ═══ 6 · Generator: docker-compose.yml ═════════════════════════════════════ */

function genCompose(s){
  const L = [];
  if (s.version) L.push('version: ' + yScalar(s.version));
  L.push('services:');
  (s.services || []).forEach(svc => {
    L.push('  ' + yScalar(svc.name) + ':');
    const b = t => L.push('    ' + t);

    if (svc.source === 'image') {
      if ((svc.image || '').trim()) b('image: ' + yScalar(svc.image.trim()));
    } else {
      const ctx = (svc.buildPath || '').trim() || '.';
      const df  = (svc.buildDockerfile || '').trim();
      const tgt = (svc.buildTarget || '').trim();
      if (df || tgt) {
        b('build:');
        b('  context: ' + yScalar(ctx));
        if (df) b('  dockerfile: ' + yScalar(df));
        if (tgt) b('  target: ' + yScalar(tgt));
      } else {
        b('build: ' + yScalar(ctx));
      }
    }

    if ((svc.containerName || '').trim()) b('container_name: ' + yScalar(svc.containerName.trim()));
    if (svc.restart) b('restart: ' + yScalar(svc.restart));

    const env = (svc.env || []).filter(r => (r.key || '').trim());
    if (env.length) {
      b('environment:');
      env.forEach(r => L.push('      ' + yScalar(r.key.trim()) + ': ' + yScalar(r.value)));
    }

    const ports = (svc.ports || []).filter(p => (p.host || '').trim() || (p.container || '').trim());
    if (ports.length) {
      b('ports:');
      ports.forEach(p => L.push('      - ' + yScalar(((p.host || '').trim() + ':' + (p.container || '').trim()) + (p.proto === 'udp' ? '/udp' : ''))));
    }

    if ((svc.dependsOn || []).length) {
      b('depends_on:');
      svc.dependsOn.forEach(n => L.push('      - ' + yScalar(n)));
    }

    const cmd = (svc.command || '').trim();
    if (cmd) {
      const ex = parseExecJson(cmd);
      if (ex) { b('command:'); ex.forEach(a => L.push('      - ' + yScalar(a))); }
      else b('command: ' + yScalar(cmd));
    }

    const hc = svc.healthcheck;
    if (hc && hc.enabled && (hc.test || '').trim()) {
      b('healthcheck:');
      const ex = parseExecJson((hc.test || '').trim());
      if (ex) { b('  test:'); ex.forEach(a => L.push('        - ' + yScalar(a))); }
      else b('  test: ' + yScalar((hc.test || '').trim()));
      b('  interval: ' + yScalar((hc.interval || '30s').trim()));
      b('  timeout: ' + yScalar((hc.timeout || '3s').trim()));
      const r = String(hc.retries == null ? '' : hc.retries).trim();
      if (r) b('  retries: ' + (/^\d+$/.test(r) ? r : yScalar(r)));
    }

    const mounts = (svc.volumeMounts || []).filter(m => (m.volume || '').trim() || (m.target || '').trim());
    if (mounts.length) {
      b('volumes:');
      mounts.forEach(m => L.push('      - ' + yScalar(((m.volume || '').trim() + ':' + (m.target || '').trim()) + (m.readonly ? ':ro' : ''))));
    }

    if ((svc.networks || []).length) {
      b('networks:');
      svc.networks.forEach(n => L.push('      - ' + yScalar(n)));
    }
  });

  if ((s.volumes || []).length) {
    L.push('volumes:');
    (s.volumes || []).forEach(v => {
      L.push('  ' + yScalar(v.name) + ':');
      if ((v.driver || '').trim()) L.push('    driver: ' + yScalar(v.driver.trim()));
      const opts = (v.driverOpts || []).filter(o => (o.key || '').trim());
      if (opts.length) {
        L.push('    driver_opts:');
        opts.forEach(o => L.push('      ' + yScalar(o.key.trim()) + ': ' + yScalar(o.value)));
      }
    });
  }

  if ((s.networks || []).length) {
    L.push('networks:');
    (s.networks || []).forEach(nt => {
      L.push('  ' + yScalar(nt.name) + ':');
      if ((nt.driver || '').trim()) L.push('    driver: ' + yScalar(nt.driver.trim()));
      if ((nt.subnet || '').trim()) {
        L.push('    ipam:');
        L.push('      config:');
        L.push('        - subnet: ' + yScalar(nt.subnet.trim()));
      }
    });
  }
  return L.join('\n') + '\n';
}

/* ═══ 7 · Generator: Dockerfile ═════════════════════════════════════════════ */

function dfExecArg(a){
  return '"' + String(a).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

function dQuoteIf(v){
  const s = String(v == null ? '' : v);
  if (s === '') return '""';
  if (/[\s"]/.test(s)) return '"' + s.replace(/"/g, '\\"') + '"';
  return s;
}

/* RUN chains: split on newlines / “&&”; keep short chains on one line,
   wrap longer ones with trailing “\” continuations (~120 char target). */
function wrapRun(cmd){
  const segs = String(cmd == null ? '' : cmd).split(/\n+|&&/).map(x => x.trim()).filter(Boolean);
  if (!segs.length) return [];
  const one = 'RUN ' + segs.join(' && ');
  if (one.length <= 120) return [one];
  return segs.map((sg, i) => (i === 0 ? 'RUN ' : '    ') + sg + (i < segs.length - 1 ? ' && \\' : ''));
}

function emitStep(st, s){
  const t = st.type;
  if (t === 'RUN') return wrapRun(st.command);
  if (t === 'WORKDIR') {
    const p = (st.path || '').trim();
    return p ? ['WORKDIR ' + p] : [];
  }
  if (t === 'COPY') {
    const src = (st.src || '').trim();
    if (!src) return [];
    const flags = [];
    const from = (st.from || '').trim();
    const stages = (s.docker && s.docker.multiStage && s.docker.stages) ? s.docker.stages : [];
    if (from && stages.some(x => (x.name || '').trim() === from)) flags.push('--from=' + from);
    if ((st.chown || '').trim()) flags.push('--chown=' + st.chown.trim());
    const dest = (st.dest || '').trim() || '.';
    return ['COPY' + (flags.length ? ' ' + flags.join(' ') : '') + ' ' + src + ' ' + dest];
  }
  if (t === 'ENV') {
    const rows = (st.pairs || []).filter(p => (p.key || '').trim());
    if (!rows.length) return [];
    return rows.map(p => 'ENV ' + p.key.trim() + '=' + dQuoteIf(p.value));
  }
  if (t === 'ARG') {
    const rows = (st.pairs || []).filter(p => (p.key || '').trim());
    if (!rows.length) return [];
    return rows.map(p => {
      const v = (p.value == null ? '' : String(p.value)).trim();
      return v ? 'ARG ' + p.key.trim() + '=' + dQuoteIf(v) : 'ARG ' + p.key.trim();
    });
  }
  if (t === 'EXPOSE') {
    const port = (st.port || '').trim();
    return port ? ['EXPOSE ' + port + (st.proto === 'udp' ? '/udp' : '')] : [];
  }
  if (t === 'USER') {
    const u = (st.user || '').trim();
    return u ? ['USER ' + u] : [];
  }
  if (t === 'CMD' || t === 'ENTRYPOINT') {
    if (st.mode === 'exec') {
      const args = String(st.exec || '').split('\n').map(x => x.trim()).filter(Boolean);
      return args.length ? [t + ' [' + args.map(dfExecArg).join(', ') + ']'] : [];
    }
    const sh = (st.shell || '').trim();
    return sh ? [t + ' ' + sh] : [];
  }
  if (t === 'HEALTHCHECK') {
    if (st.mode === 'none') return ['HEALTHCHECK NONE'];
    const test = (st.test || '').trim();
    if (!test) return [];
    const flags = [];
    if ((st.interval || '').trim()) flags.push('--interval=' + st.interval.trim());
    if ((st.timeout || '').trim()) flags.push('--timeout=' + st.timeout.trim());
    if ((st.retries || '').trim()) flags.push('--retries=' + st.retries.trim());
    const body = /^CMD\b/i.test(test) ? test : 'CMD ' + test;
    return ['HEALTHCHECK' + (flags.length ? ' ' + flags.join(' ') : '') + ' ' + body];
  }
  return [];
}

function genDockerfile(s){
  const d = s.docker || {};
  const L = [];
  const emitSteps = steps => (steps || []).forEach(st => emitStep(st, s).forEach(l => L.push(l)));
  if (d.multiStage && (d.stages || []).length) {
    d.stages.forEach((st, i) => {
      if (i) L.push('');
      const base = (st.baseImage || '').trim() || 'scratch';
      const name = (st.name || '').trim();
      L.push('FROM ' + base + (name ? ' AS ' + name : ''));
      emitSteps(st.steps);
    });
  } else {
    L.push('FROM ' + ((d.singleBaseImage || '').trim() || 'scratch'));
    emitSteps(d.steps);
  }
  return L.join('\n') + '\n';
}

/* ═══ 8 · Generator: docker run (primary service) ═══════════════════════════ */

function genRun(s){
  const svc = (s.services || [])[0];
  if (!svc) return '';
  const parts = ['docker run'];
  const nm = (svc.containerName || '').trim();
  if (nm) parts.push('--name ' + nm);
  (svc.ports || []).filter(p => (p.host || '').trim() && (p.container || '').trim())
    .forEach(p => parts.push('-p ' + p.host.trim() + ':' + p.container.trim() + (p.proto === 'udp' ? '/udp' : '')));
  (svc.volumeMounts || []).filter(m => (m.volume || '').trim() && (m.target || '').trim())
    .forEach(m => parts.push('-v ' + m.volume.trim() + ':' + String(m.target).trim() + (m.readonly ? ':ro' : '')));
  (svc.env || []).filter(e => (e.key || '').trim())
    .forEach(e => parts.push('-e ' + dfExecArg(e.key.trim() + '=' + String(e.value == null ? '' : e.value))));
  (svc.networks || []).forEach(n => parts.push('--network ' + n));
  if (svc.restart && svc.restart !== 'no') parts.push('--restart ' + svc.restart);
  const img = svc.source === 'image' ? (svc.image || '').trim() : (svc.name || 'app').trim() + ':latest';
  if (img) parts.push(img);
  const cmd = (svc.command || '').trim();
  if (cmd) {
    const ex = parseExecJson(cmd);
    if (ex) ex.forEach(a => parts.push(dfExecArg(a)));
    else parts.push(cmd);
  }
  return parts.join(' ');
}

/* ═══ 9 · Validator ═════════════════════════════════════════════════════════ */

function validateState(s){
  const E = [], W = [];
  const err = (path, msg) => E.push({ path, msg });

  const d = s.docker || {};
  /* E1 + stage structure */
  if (d.multiStage) {
    const stages = d.stages || [];
    if (!stages.length) E.push({ msg: 'Multi-stage is on but no stage is defined — add a stage or switch it off.' });
    stages.forEach((st, i) => {
      if (!(st.baseImage || '').trim()) err('docker.stages.' + i + '.baseImage', 'Stage "' + ((st.name || '').trim() || 'Stage ' + (i + 1)) + '": base image is required.');
      const nm = (st.name || '').trim();
      if (!nm) err('docker.stages.' + i + '.name', 'Stage name is required.');
      else {
        if (!IDENT.test(nm)) err('docker.stages.' + i + '.name', 'Stage names use [A-Za-z0-9][A-Za-z0-9_.-]*.');
      }
    });
    const seen = new Set();
    stages.forEach((st, i) => {
      const nm = (st.name || '').trim();
      if (nm && seen.has(nm)) err('docker.stages.' + i + '.name', 'Duplicate stage name "' + nm + '".');
      if (nm) seen.add(nm);
      const earlier = stages.slice(0, i).map(x => (x.name || '').trim()).filter(Boolean);
      (st.steps || []).forEach((step, si) => {
        if (step.type === 'COPY') {
          const from = (step.from || '').trim();
          if (from && !earlier.includes(from)) err('docker.stages.' + i + '.steps.' + si + '.from', 'COPY --from target "' + from + '" is not an earlier stage.');
        }
      });
    });
  } else if (!(d.singleBaseImage || '').trim()) {
    err('docker.singleBaseImage', 'Base image is required (e.g. node:20-alpine).');
  }

  /* E2 + services */
  const svcs = s.services || [];
  if (!svcs.length) E.push({ msg: 'Define at least one service in the Compose section.' });
  const svcNames = svcs.map(x => (x.name || '').trim());
  const svcSet = new Set(svcNames);
  const volSet = new Set((s.volumes || []).map(v => (v.name || '').trim()));
  const netSet = new Set((s.networks || []).map(n => (n.name || '').trim()));

  svcs.forEach((svc, i) => {
    const nm = (svc.name || '').trim();
    if (!nm) err('services.' + i + '.name', 'Service name is required.');
    else {
      if (!IDENT.test(nm)) err('services.' + i + '.name', 'Service names use [A-Za-z0-9][A-Za-z0-9_.-]*.');
      if (svcNames.indexOf(nm) !== svcNames.lastIndexOf(nm)) err('services.' + i + '.name', 'Duplicate service name "' + nm + '".');
    }
    if (svc.source === 'image') {
      if (!(svc.image || '').trim()) err('services.' + i + '.image', 'Image is required when the source is "image" (or switch the source to "build").');
    } else {
      if (!(svc.buildPath || '').trim()) err('services.' + i + '.buildPath', 'Build context path is required (use "." for the project root).');
      if (!(svc.buildDockerfile || '').trim()) W.push({ msg: 'Build Dockerfile name is empty for service "' + nm + '" — Compose defaults to "Dockerfile".' });
    }
    (svc.ports || []).forEach((p, pi) => {
      const host = (p.host || '').trim(), cont = (p.container || '').trim();
      if (!host && !cont) return;
      if (!/^\d+$/.test(host)) err('services.' + i + '.ports.' + pi + '.host', 'Host port must be all digits (mappings look like 3000:3000).');
      if (!/^\d+$/.test(cont)) err('services.' + i + '.ports.' + pi + '.container', 'Container port must be all digits (mappings look like 3000:3000).');
    });
    (svc.dependsOn || []).forEach(n => {
      if (!svcSet.has(n)) err('services.' + i + '.dependsOn', 'depends_on references "' + n + '", which is not a defined service.');
    });
    (svc.volumeMounts || []).forEach((m, mi) => {
      const vol = (m.volume || '').trim(), tgt = (m.target || '').trim();
      if (!vol && !tgt) return;
      if (!vol) err('services.' + i + '.volumeMounts.' + mi + '.volume', 'Pick a declared volume (or add one in the Volumes section).');
      else if (!volSet.has(vol)) err('services.' + i + '.volumeMounts.' + mi + '.volume', 'Volume "' + vol + '" is not declared in the Volumes section.');
      if (!tgt && vol) err('services.' + i + '.volumeMounts.' + mi + '.target', 'Mount target path is required (e.g. /data).');
    });
    (svc.networks || []).forEach(n => {
      if (!netSet.has(n)) err('services.' + i + '.networks', 'Network "' + n + '" is not declared in the Networks section.');
    });
    if (svc.healthcheck && svc.healthcheck.enabled && !(svc.healthcheck.test || '').trim()) {
      err('services.' + i + '.healthcheck.test', 'Healthcheck test command is required when the healthcheck is enabled.');
    }
  });

  /* E5 / E6 — volumes & networks */
  const vols = s.volumes || [];
  const volNames = vols.map(v => (v.name || '').trim());
  vols.forEach((v, i) => {
    const nm = (v.name || '').trim();
    if (!nm) err('volumes.' + i + '.name', 'Volume name is required.');
    else {
      if (!IDENT.test(nm)) err('volumes.' + i + '.name', 'Volume names use [A-Za-z0-9][A-Za-z0-9_.-]*.');
      if (volNames.indexOf(nm) !== volNames.lastIndexOf(nm)) err('volumes.' + i + '.name', 'Duplicate volume name "' + nm + '".');
    }
  });
  const nets = s.networks || [];
  const netNames = nets.map(n => (n.name || '').trim());
  nets.forEach((nt, i) => {
    const nm = (nt.name || '').trim();
    if (!nm) err('networks.' + i + '.name', 'Network name is required.');
    else {
      if (!IDENT.test(nm)) err('networks.' + i + '.name', 'Network names use [A-Za-z0-9][A-Za-z0-9_.-]*.');
      if (netNames.indexOf(nm) !== netNames.lastIndexOf(nm)) err('networks.' + i + '.name', 'Duplicate network name "' + nm + '".');
    }
  });

  /* Warnings */
  if (!s.version) W.push({ msg: 'Compose "version" key is omitted — modern Compose ignores it (informational).' });
  const keys = new Set((s.dotenv || []).map(e => (e.key || '').trim()).filter(Boolean));
  const used = new Set();
  const scan = t => {
    String(t == null ? '' : t).replace(/\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/g, (m, n) => { used.add(n); return m; });
  };
  svcs.forEach(svc => {
    (svc.env || []).forEach(e => scan(e.value));
    scan(svc.command);
    if (svc.healthcheck && svc.healthcheck.enabled) scan(svc.healthcheck.test);
  });
  const missing = [];
  used.forEach(k => { if (!keys.has(k)) missing.push(k); });
  missing.sort();
  if (missing.length) W.push({ type: 'envref', keys: missing, msg: 'Referenced in Compose but missing from .env: ' + missing.map(k => '${' + k + '}').join(', ') + '.' });

  return { errors: E, warnings: W };
}

/* ═══ 10 · Highlighters (hand-rolled tokenizers) ════════════════════════════ */

function classifyScalar(raw){
  const s = raw.trim();
  if (!s) return '';
  if (/^(y|Y|n|N|yes|no|true|false|on|off|null|~)$/i.test(s)) return 'tk-bool';
  if (/^[+-]?(\d[\d_]*(\.\d*)?([eE][+-]?\d+)?|\.\d+|(\d[\d_]*)?\.(\d+|inf)|\.nan)$/.test(s)) return 'tk-num';
  return '';
}

function tokenizeYamlLine(line){
  const toks = [];
  let last = 0, pos = 0;
  const n = line.length;
  const flush = cls => { if (pos > last) toks.push({ t: line.slice(last, pos), c: cls || '' }); last = pos; };
  const skipWS = () => { while (pos < n && (line[pos] === ' ' || line[pos] === '\t')) pos++; };

  skipWS(); flush();
  if (line[pos] === '#') { pos = n; flush('tk-com'); return toks; }
  if (line[pos] === '-' && (n - pos === 1 || line[pos + 1] === ' ' || line[pos + 1] === '\t')) { pos++; flush('tk-dash'); }
  skipWS(); flush();
  if (pos >= n) return toks;

  /* key: an unquoted “:” followed by whitespace or end-of-line */
  let k = pos, q = null, colon = -1;
  while (k < n) {
    const ch = line[k];
    if (q) {
      if (ch === '\\' && q === '"') { k++; }
      else if (ch === q) { q = null; }
    } else if (ch === '"' || ch === "'") { q = ch; }
    else if (ch === '#' && (k === 0 || line[k - 1] === ' ' || line[k - 1] === '\t')) { break; }
    else if (ch === ':' && (k + 1 >= n || line[k + 1] === ' ' || line[k + 1] === '\t')) { colon = k; break; }
    k++;
  }
  if (colon >= 0) {
    pos = colon; flush('tk-key');
    pos = colon + 1; skipWS(); flush('tk-col');   /* “:␣␣” as one dim token */
    if (pos >= n) return toks;
    if (line[pos] === '#') { pos = n; flush('tk-com'); return toks; }
  } else if (k < n && line[k] === '#') {
    pos = k; flush();
    pos = n; flush('tk-com');
    return toks;
  }
  if (pos >= n) return toks;

  /* value */
  const ch0 = line[pos];
  if (ch0 === '"' || ch0 === "'") {
    let e = pos + 1;
    while (e < n) {
      if (ch0 === '"' && line[e] === '\\') { e += 2; continue; }
      if (line[e] === ch0) { e++; break; }
      e++;
    }
    if (e > n) e = n;
    pos = e; flush('tk-str');
    skipWS(); flush();
    if (line[pos] === '#') { pos = n; flush('tk-com'); return toks; }
    pos = n; flush();
    return toks;
  }
  /* plain scalar, stops at an unquoted “ #” */
  let end = pos;
  while (end < n && !(line[end] === '#' && (end === 0 || line[end - 1] === ' ' || line[end - 1] === '\t'))) end++;
  const raw = line.slice(pos, end);
  pos = end;
  flush(raw.trim() === '' ? '' : classifyScalar(raw));
  if (end < n) { pos = n; flush('tk-com'); }
  return toks;
}

const DL_INSTR = new Set(['FROM','RUN','CMD','COPY','WORKDIR','ENV','ARG','EXPOSE','USER','ENTRYPOINT','HEALTHCHECK','LABEL','MAINTAINER','VOLUME','SHELL','STOPSIGNAL','ONBUILD']);

function tokenizeDockerfileLine(line){
  const toks = [];
  let last = 0, pos = 0;
  const n = line.length;
  const flush = cls => { if (pos > last) toks.push({ t: line.slice(last, pos), c: cls || '' }); last = pos; };
  const skipWS = () => { while (pos < n && (line[pos] === ' ' || line[pos] === '\t')) pos++; };

  skipWS(); flush();
  if (line[pos] === '#') { pos = n; flush('tk-com'); return toks; }
  if (pos >= n) { pos = n; flush(); return toks; }

  const m = /^[A-Za-z]+/.exec(line.slice(pos));
  if (m && DL_INSTR.has(m[0].toUpperCase())) {
    pos += m[0].length; flush('tk-kw');
  } else {
    pos += (m ? m[0].length : 0); flush();
  }

  while (pos < n) {
    const ch = line[pos];
    if (ch === ' ' || ch === '\t') { skipWS(); flush(); continue; }
    if (ch === '#') { pos = n; flush('tk-com'); break; }
    if (ch === '"' || ch === "'") {
      const q0 = ch; let e = pos + 1;
      while (e < n) {
        if (q0 === '"' && line[e] === '\\') { e += 2; continue; }
        if (line[e] === q0) { e++; break; }
        e++;
      }
      if (e > n) e = n;
      pos = e; flush('tk-str');
      continue;
    }
    if (ch === '-' && line[pos + 1] === '-') {
      let e = pos + 2;
      while (e < n && /[A-Za-z0-9_-]/.test(line[e])) e++;
      if (line[e] === '=') {
        e++;
        if (line[e] === '"' || line[e] === "'") {
          const q0 = line[e]; let f = e + 1;
          while (f < n) {
            if (q0 === '"' && line[f] === '\\') { f += 2; continue; }
            if (line[f] === q0) { f++; break; }
            f++;
          }
          if (f > n) f = n;
          e = f;
        } else {
          while (e < n && !/\s/.test(line[e])) e++;
        }
      }
      pos = e; flush('tk-flag');
      continue;
    }
    if (ch === 'A' && line.slice(pos, pos + 2) === 'AS' && (pos + 2 >= n || /\s/.test(line[pos + 2]))) {
      pos += 2; flush('tk-kw');
      continue;
    }
    /* plain run until the next token start or whitespace */
    let k2 = pos + 1;
    while (k2 < n) {
      const c = line[k2];
      if (/\s/.test(c) || c === '#' || c === '"' || c === "'") break;
      if (c === '-' && line[k2 + 1] === '-') break;
      if (c === 'A' && line.slice(k2, k2 + 2) === 'AS' && (k2 + 2 >= n || /\s/.test(line[k2 + 2]))) break;
      k2++;
    }
    pos = k2; flush();
  }
  return toks;
}

const SVG_NS = 'http://www.w3.org/2000/svg';

function h(tag, attrs){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'for') el.htmlFor = v;
    else if (k === 'value') el.value = String(v);
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'selected') el.selected = !!v;
    else if (k === 'hidden') el.hidden = !!v;
    else if (k === 'disabled') el.disabled = !!v;
    else if (k === 'draggable') el.draggable = !!v;
    else if (k === 'tabindex') el.tabIndex = +v;
    else el.setAttribute(k, String(v === true ? '' : v));
  }
  for (let i = 2; i < arguments.length; i++) {
    const add = c => {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      if (c instanceof Node) el.appendChild(c);
      else el.appendChild(document.createTextNode(String(c)));
    };
    add(arguments[i]);
  }
  return el;
}

const LS_STATE = 'docker-ui-state-v2';
const LS_THEME = 'docker-ui-theme';
const memStorage = {};

function lsGet(k){
  try { return window.localStorage.getItem(k); } catch (_) { return Object.prototype.hasOwnProperty.call(memStorage, k) ? memStorage[k] : null; }
}
function lsSet(k, v){
  try { window.localStorage.setItem(k, v); } catch (_) { memStorage[k] = v; }
}

function loadState(){
  const raw = lsGet(LS_STATE);
  if (raw) {
    try {
      const s = JSON.parse(raw);
      if (s && typeof s === 'object' && s.schema === STORAGE_SCHEMA && s.docker) return normalize(s);
    } catch (_) { /* corrupt → fall through to seed */ }
  }
  return seedState();
}

function countLines(text){
  if (!text) return 0;
  const n = text.split('\n').length;
  return text.endsWith('\n') ? n - 1 : n;
}

function highlightInto(codeEl, text, lang){
  codeEl.replaceChildren();
  const tok = lang === 'yaml' ? tokenizeYamlLine : tokenizeDockerfileLine;
  const lines = String(text).split('\n');
  lines.forEach((ln, idx) => {
    tok(ln).forEach(t => {
      const sp = document.createElement('span');
      if (t.c) sp.className = t.c;
      sp.textContent = t.t;
      codeEl.appendChild(sp);
    });
    if (idx < lines.length - 1) codeEl.appendChild(document.createTextNode('\n'));
  });
}

function renderBanners(){
  bannersEl.replaceChildren();
  if (validation.errors.length) {
    const b = h('div', { class: 'banner banner-err', role: 'alert' }, icon('warn', 14),
      h('div', null, h('strong', null, 'Fix ' + validation.errors.length + ' error' + (validation.errors.length === 1 ? '' : 's') + ' — Download is blocked.'),
        h('div', { class: 'blist' },
          validation.errors.slice(0, 20).map(e => h('div', null, '• ' + e.msg)).concat(
            validation.errors.length > 20 ? [h('div', null, '… and ' + (validation.errors.length - 20) + ' more')] : []))));
    bannersEl.appendChild(b);
  }
  if (validation.warnings.length) {
    const b = h('div', { class: 'banner banner-warn' }, icon('warn', 14),
      h('div', null, h('strong', null, validation.warnings.length + ' warning' + (validation.warnings.length === 1 ? '' : 's') + ':'),
        h('div', { class: 'blist' },
          validation.warnings.slice(0, 20).map(w => h('div', null, '• ' + w.msg)))));
    bannersEl.appendChild(b);
  }
}

function renderPreview(){
  const isDf = state.activeTab !== 'compose';
  const tabD = document.getElementById('tab-dockerfile');
  const tabC = document.getElementById('tab-compose');
  tabD.setAttribute('aria-selected', String(isDf)); tabD.tabIndex = isDf ? 0 : -1;
  tabC.setAttribute('aria-selected', String(!isDf)); tabC.tabIndex = isDf ? -1 : 0;
  panelDf.hidden = !isDf;
  panelCo.hidden = isDf;

  highlightInto(codeDf, gen.dockerfile, 'dockerfile');
  highlightInto(codeCo, gen.compose, 'yaml');

  const fname = isDf ? 'Dockerfile' : 'docker-compose.yml';
  const lines = isDf ? countLines(gen.dockerfile) : countLines(gen.compose);
  const E = validation.errors.length, W = validation.warnings.length;
  const text = fname + ' · ' + lines + ' lines · ' + E + (E === 1 ? ' error' : ' errors') + (W ? ' · ' + W + (W === 1 ? ' warning' : ' warnings') : '');
  if (text !== lastStatus) { lastStatus = text; statusEl.textContent = text; }

  btnDownload.disabled = E > 0;
  btnDownload.title = E ? 'Fix ' + E + ' validation error' + (E === 1 ? '' : 's') + ' to enable download' : 'Download ' + fname;
  btnCopy.title = 'Copy ' + fname + ' to clipboard';
  btnRunCopy.hidden = isDf;
  btnRunCopy.disabled = !gen.run;
  btnRunCopy.title = gen.run ? 'Copy a “docker run” command for the first service' : 'No service is defined yet';

  renderBanners();
}

/* ═══ 19 · Copy / Download / Toast / Theme ══════════════════════════════════ */

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

async function copyText(t, okMsg){
  try {
    await navigator.clipboard.writeText(t);
    toast(okMsg || 'Copied to clipboard');
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
    toast(ok ? (okMsg || 'Copied to clipboard') : 'Copy failed — select the preview text manually');
  }
}

function downloadFile(name, text){
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  toast('Downloading ' + name);
}

let toastTheme = null;
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('ico-sun').hidden = (t === 'light');  /* dark mode offers the switch to light */
  document.getElementById('ico-moon').hidden = (t === 'dark');
}

function flush(withSectionRender){
  validation = validateState(state);
  gen.dockerfile = genDockerfile(state);
  gen.compose = genCompose(state);
  gen.run = genRun(state);
  if (withSectionRender) renderSection();
  applyErrors();
  renderPreview();
  persist();
}

let structQueued = false;
function structural(){
  if (structQueued) return;
  structQueued = true;
  queueMicrotask(() => { structQueued = false; flush(true); });
}

const schedule = debounce(() => flush(false), 150);

function applyErrors(){
  formPanel.querySelectorAll('.field-error').forEach(n => n.remove());
  formPanel.querySelectorAll('[aria-invalid]').forEach(n => {
    n.removeAttribute('aria-invalid');
    n.removeAttribute('aria-describedby');
  });
  formPanel.querySelectorAll('.inv').forEach(n => n.classList.remove('inv'));

  const byPath = {};
  validation.errors.forEach(e => { if (e.path) (byPath[e.path] = byPath[e.path] || []).push(e.msg); });

  Object.keys(byPath).forEach(path => {
    const target = formPanel.querySelector('[data-field="' + path + '"]');
    if (!target) return;
    const wrap = target.matches('input,select,textarea')
      ? (target.closest('.field') || target.closest('.rep-row') || target.parentElement || target)
      : target;
    wrap.classList.add('inv');
    const errId = 'dui-err-' + (++errSeq);
    wrap.appendChild(h('div', { class: 'field-error', id: errId }, byPath[path].join(' ')));
    const ctl = wrap.matches('input,select,textarea') ? wrap : wrap.querySelector('input,select,textarea');
    if (ctl) {
      ctl.setAttribute('aria-invalid', 'true');
      ctl.setAttribute('aria-describedby', errId);
    }
  });
}

/* ═══ 22 · Structural mutations & actions ═══════════════════════════════════ */

function newItemFor(listPath){
  const key = String(listPath).split('.').filter(x => !/^\d+$/.test(x)).pop();
  const F = {
    steps:        () => ({ id: uid(), type: 'RUN', command: '' }),
    stages:       () => ({ id: uid(), name: '', baseImage: '', steps: [] }),
    services:     () => newService(),
    volumes:      () => ({ id: uid(), name: '', driver: 'local', driverOpts: [] }),
    networks:     () => ({ id: uid(), name: '', driver: 'bridge', subnet: '' }),
    ports:        () => ({ id: uid(), host: '', container: '', proto: 'tcp' }),
    volumeMounts: () => ({ id: uid(), volume: '', target: '', readonly: false }),
    env:          () => ({ key: '', value: '' }),
    dotenv:       () => ({ key: '', value: '' }),
    pairs:        () => ({ key: '', value: '' }),
    driverOpts:   () => ({ key: '', value: '' })
  };
  return (F[key] || F.env)();
}

function cascade(listPath, item){
  if (listPath === 'services') {
    const nm = (item.name || '').trim();
    state.services.forEach(s => { s.dependsOn = (s.dependsOn || []).filter(n => n !== nm); });
    toast(nm ? 'Removed service "' + nm + '"' : 'Removed service');
  } else if (listPath === 'volumes') {
    const nm = (item.name || '').trim();
    let n = 0;
    state.services.forEach(s => {
      const before = s.volumeMounts.length;
      s.volumeMounts = s.volumeMounts.filter(m => m.volume !== nm);
      n += before - s.volumeMounts.length;
    });
    toast(n ? 'Removed volume "' + nm + '" — detached from ' + n + ' mount' + (n === 1 ? '' : 's') : 'Removed volume "' + nm + '"');
  } else if (listPath === 'networks') {
    const nm = (item.name || '').trim();
    let n = 0;
    state.services.forEach(s => {
      const i = s.networks.indexOf(nm);
      if (i >= 0) { s.networks.splice(i, 1); n++; }
    });
    toast(n ? 'Removed network "' + nm + '" — detached from ' + n + ' service' + (n === 1 ? '' : 's') : 'Removed network "' + nm + '"');
  } else if (listPath === 'docker.stages') {
    const nm = (item.name || '').trim();
    state.docker.stages.forEach(st => (st.steps || []).forEach(sp => { if (sp.from === nm) sp.from = ''; }));
    toast('Removed stage "' + (nm || 'unnamed') + '"');
  }
}

function doAction(name, arg){
  if (name === 'dotenv-import') {
    const ta = document.getElementById('env-paste');
    if (!ta) return;
    const rows = parseDotenv(ta.value);
    if (!rows.length) { toast('Nothing to import — use KEY=VALUE lines'); return; }
    const byKey = new Map(state.dotenv.filter(x => (x.key || '').trim()).map(x => [x.key, x]));
    rows.forEach(r => {
      const ex = byKey.get(r.key);
      if (ex) ex.value = r.value;
      else { state.dotenv.push(r); byKey.set(r.key, r); }
    });
    ta.value = '';
    toast('Imported ' + rows.length + ' .env entr' + (rows.length === 1 ? 'y' : 'ies'));
    structural();
  } else if (name === 'loadenv') {
    const svc = state.services[arg];
    if (!svc) return;
    let n = 0;
    (state.dotenv || []).forEach(e => {
      const k = (e.key || '').trim();
      if (!k) return;
      if ((svc.env || []).some(x => (x.key || '').trim() === k)) return;
      svc.env.push({ key: k, value: '${' + k + '}' });
      n++;
    });
    toast(n ? 'Inserted ' + n + ' .env reference row' + (n === 1 ? '' : 's') : 'All .env keys are already present (or .env is empty)');
    structural();
  }
}

function runAction(btn){
  const p = String(btn.dataset.action || '').split('|');
  const verb = p[0];
  const listPath = p[1] || '';
  if (verb === 'add') {
    const list = getIn(state, listPath);
    if (!Array.isArray(list)) return;
    list.push(newItemFor(listPath));
    structural();
    return;
  }
  if (verb === 'del') {
    const i = +p[2];
    const list = getIn(state, listPath);
    if (!Array.isArray(list) || !(i >= 0 && i < list.length)) return;
    const item = list.splice(i, 1)[0];
    cascade(listPath, item);
    structural();
    return;
  }
  if (verb === 'up' || verb === 'down') {
    const i = +p[2];
    const list = getIn(state, listPath);
    if (!Array.isArray(list)) return;
    const to = verb === 'up' ? i - 1 : i + 1;
    if (to < 0 || to >= list.length) return;
    list.splice(to, 0, list.splice(i, 1)[0]);
    structural();
    return;
  }
  if (verb === 'do') {
    doAction(p[1], p[2] !== undefined && p[2] !== '' ? +p[2] : undefined);
  }
}

/* ═══ 23 · Field mutation ═══════════════════════════════════════════════════ */

function mutateField(el, ctl){
  const path = ctl.dataset.field;
  if (!path) return;
  if (el.type === 'checkbox' && el.dataset.checklist !== undefined) {
    const list = getIn(state, path);
    if (!Array.isArray(list)) return;
    const nm = String(el.dataset.checklist);
    const idx = list.indexOf(nm);
    if (el.checked && idx < 0) list.push(nm);
    else if (!el.checked && idx >= 0) list.splice(idx, 1);
    return;
  }
  const old = getIn(state, path);
  const val = el.type === 'checkbox' ? el.checked : el.value;
  setIn(state, path, val);
  renameRefs(state, path, old, val);
  syncRenamedDOM(path, old, val);
}

/* Keeps checkbox labels / select options in step with renamed services,
   volumes, networks and stages without a full re-render (focus stays put). */
function syncRenamedDOM(path, oldV, newV){
  const m = /(?:^|\.)(services|volumes|networks|stages)\.(\d+)\.name$/.exec(String(path || ''));
  if (!m || oldV == null || oldV === '' || newV === oldV) return;
  const o = String(oldV), n = String(newV);
  if (m[1] === 'volumes') {
    formPanel.querySelectorAll('select[data-field$=".volume"]').forEach(sel => {
      Array.from(sel.options).forEach(opt => { if (opt.value === o) { opt.value = n; opt.textContent = n; } });
    });
  } else {
    formPanel.querySelectorAll('[data-checklist]').forEach(el => {
      if (el.dataset.checklist === o) {
        el.dataset.checklist = n;
        const sp = el.closest('label') ? el.closest('label').querySelector('span') : null;
        if (sp) sp.textContent = n;
      }
    });
    if (m[1] === 'stages') {
      formPanel.querySelectorAll('select[data-field$=".from"]').forEach(sel => {
        Array.from(sel.options).forEach(opt => { if (opt.value === o) { opt.value = n; opt.textContent = n; } });
      });
    }
  }
}

function onFormInput(e){
  const el = e.target;
  if (!(el instanceof Element)) return;
  const ctl = el.closest('[data-field]');
  if (!ctl) return;
  mutateField(el, ctl);
  if (ctl.dataset.re === 'section') structural();
  else schedule();
}

/* ═══ 24 · Tab switching ════════════════════════════════════════════════════ */

function switchTab(t){
  if (state.activeTab === t) { renderPreview(); return; }
  state.activeTab = t;
  flush(false);
}

/* ═══ 25 · Wiring & bootstrap ═══════════════════════════════════════════════ */

document.addEventListener('click', e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const navBtn = t.closest('[data-nav]');
  if (navBtn) {
    if (state.activeSection !== navBtn.dataset.nav) {
      state.activeSection = navBtn.dataset.nav;
      updateNav();
      structural();
    }
    return;
  }
  const act = t.closest('[data-action]');
  if (act) { runAction(act); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { switchTab(tab.dataset.tab); return; }
});

formPanel.addEventListener('input', onFormInput);
formPanel.addEventListener('change', onFormInput);

/* Drag-to-reorder delegation (HTML5 DnD, applied to step rows) */
document.addEventListener('dragstart', e => {
  const row = e.target && e.target.closest ? e.target.closest('[data-draglist]') : null;
  if (!row) return;
  const listPath = row.getAttribute('data-draglist');
  const idx = +row.getAttribute('data-dragindex');
  dragCtx = { listPath, idx };
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(idx)); } catch (_) {}
});
document.addEventListener('dragover', e => {
  if (!dragCtx) return;
  const row = e.target && e.target.closest ? e.target.closest('[data-draglist="' + dragCtx.listPath + '"]') : null;
  if (!row) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const r = row.getBoundingClientRect();
  const below = e.clientY > r.top + r.height / 2;
  row.classList.toggle('drop-below', below);
  row.classList.toggle('drop-above', !below);
});
document.addEventListener('drop', e => {
  if (!dragCtx) return;
  const row = e.target && e.target.closest ? e.target.closest('[data-draglist="' + dragCtx.listPath + '"]') : null;
  if (!row) { return; }
  e.preventDefault();
  const list = getIn(state, dragCtx.listPath);
  const below = row.classList.contains('drop-below');
  document.querySelectorAll('.drop-above, .drop-below, .dragging').forEach(n => n.classList.remove('drop-above', 'drop-below', 'dragging'));
  if (!Array.isArray(list)) { dragCtx = null; return; }
  const from = dragCtx.idx;
  let to = +row.getAttribute('data-dragindex');
  if (below) to += 1;
  dragCtx = null;
  if (to === from || to === from + 1) return;
  list.splice(to > from ? to - 1 : to, 0, list.splice(from, 1)[0]);
  structural();
});
document.addEventListener('dragend', () => {
  dragCtx = null;
  document.querySelectorAll('.drop-above, .drop-below, .dragging').forEach(n => n.classList.remove('drop-above', 'drop-below', 'dragging'));
});

/* Preview tabs — roving tabindex + arrow / Home / End keyboard navigation */
const tabsBar = document.querySelector('.pv-tabs');
tabsBar.addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  e.preventDefault();
  let cur = state.activeTab === 'compose' ? 1 : 0;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') cur = (cur + 1) % 2;
  else if (e.key === 'Home') cur = 0;
  else cur = 1;
  const id = cur === 0 ? 'dockerfile' : 'compose';
  switchTab(id);
  document.getElementById('tab-' + id).focus();
});

/* Topbar actions */
btnCopy.addEventListener('click', () => {
  copyText(state.activeTab === 'compose' ? gen.compose : gen.dockerfile, state.activeTab === 'compose' ? 'docker-compose.yml copied' : 'Dockerfile copied');
});
btnRunCopy.addEventListener('click', () => { if (gen.run) copyText(gen.run, 'docker run command copied'); });
btnDownload.addEventListener('click', () => {
  if (validation.errors.length) { toast('Resolve the validation errors first'); return; }
  if (state.activeTab === 'compose') downloadFile('docker-compose.yml', gen.compose);
  else downloadFile('Dockerfile', gen.dockerfile);
});
document.getElementById('btn-theme').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme(state.theme);
  persist();
  toast(state.theme === 'dark' ? 'Dark theme' : 'Light theme');
});
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!window.confirm('Reset the entire configuration back to the default example? This cannot be undone.')) return;
  const theme = state.theme;
  state = seedState();
  state.theme = theme;
  applyTheme(state.theme);
  renderNav();
  flush(true);
  toast('Reset to the default sample');
});

/* Bootstrap */
state = normalize(state);
applyTheme(state.theme);
renderNav();
flush(true);

})();
</script>
